<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,user-scalable=no">
<title>Christopher's Silly Mansion</title>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}

#status{
	position:absolute;
	inset:0;
	display:flex;
	align-items:center;
	justify-content:center;
	visibility:hidden;
	pointer-events:none
}

#spinner{
	width:36px;
	height:36px;
	border:4px solid #444;
	border-top-color:#fff;
	border-radius:50%;
	animation:spin .8s linear infinite
}

@keyframes spin{to{transform:rotate(360deg)}}

#progress{
	width:366px;
	height:7px;
	padding:1px;
	background:#38363a;
	border:1px solid #444;
	border-radius:2px
}

#progress>div{
	width:0;
	height:100%;
	background:#fff;
	transition:width .3s
}

#error{
	padding:8px 12px;
	color:#fff;
	font:14px Arial,sans-serif;
	background:#333;
	border:1px solid #555;
	border-radius:4px
}

@media(orientation:portrait){
	#progress{width:61.8%}
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<div id="status">
	<div id="spinner"></div>
	<div id="progress"><div></div></div>
	<div id="error"></div>
</div>

<script src="https://media.blooket.com/raw/upload/ejzmacd4ps8sthpledfo.js"></script>

<script>
const BASE_URL="https://media.blooket.com/raw/upload/";
const PACK_URL=BASE_URL+"hnfdbrc3fajdcax0ddjp.pck";
const WASM_URL=BASE_URL+"cdgjqbjfxea0mkffu2z8.wasm";

const GODOT_CONFIG={
	args:[],
	canvasResizePolicy:2,
	executable:"index",
	experimentalVK:false,
	focusCanvas:true,
	gdnativeLibs:[],
	mainPack:PACK_URL,
	fileSizes:{
		[PACK_URL]:42459792,
		[WASM_URL]:13793958
	}
};

const status=document.getElementById("status");
const spinner=document.getElementById("spinner");
const progress=document.getElementById("progress");
const progressBar=progress.firstElementChild;
const error=document.getElementById("error");

progress.style.display="none";
error.style.display="none";

const originalFetch=window.fetch;

window.fetch=function(resource,init){
	const url=typeof resource==="string"
		?resource
		:resource.url;

	if(url?.endsWith("index.wasm"))
		resource=WASM_URL;

	return originalFetch.call(this,resource,init);
};

function showStatus(mode){
	spinner.style.display=mode==="spinner"?"block":"none";
	progress.style.display=mode==="progress"?"block":"none";
	error.style.display=mode==="error"?"block":"none";

	if(mode==="hidden"){
		status.style.visibility="hidden";
		status.style.display="none";
	}else{
		status.style.visibility="visible";
		status.style.display="flex";
	}
}

function showError(errorMessage){
	error.textContent=errorMessage.message||errorMessage;
	console.error(errorMessage);
	showStatus("error");
}

if(!Engine.isWebGLAvailable()){
	showError("WebGL not available");
}else{
	showStatus("spinner");

	const engine=new Engine(GODOT_CONFIG);

	engine.startGame({
		onProgress(current,total){
			if(total>0){
				progressBar.style.width=current/total*100+"%";
				showStatus("progress");

				if(current===total){
					setTimeout(()=>showStatus("spinner"),500);
				}
			}else{
				showStatus("spinner");
			}
		}
	}).then(
		()=>{
			status.style.visibility="hidden";
			status.style.display="none";
		},
		showError
	);
}
</script>
</body>
</html>
