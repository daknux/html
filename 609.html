const bossMusicHelper="// Compatibility for this pinned GameMaker WASM runner. No track selection changes.\n(() => {\n 'use strict';\n const expectedHash='956fcd252073d68454238006d03c121becc9e850b4d40f0f9dd930ed9563fb9b';\n const attached=new WeakSet();let ready=null;\n function typedCallback(callback){\n  const section=(id,data)=>[id,data.length,...data];\n  const type=[1,96,5,127,127,127,127,127,0],imports=[1,1,101,1,102,0,0],exports=[1,1,102,0,0];\n  const module=new WebAssembly.Module(new Uint8Array([0,97,115,109,1,0,0,0,...section(1,type),...section(2,imports),...section(7,exports)]));\n  return new WebAssembly.Instance(module,{e:{f:callback}}).exports.f;\n }\n async function hash(bytes){if(!bytes||!crypto.subtle)return null;return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');}\n function install(result,fingerprint){\n  const instance=result.instance||result;if(!instance?.exports||attached.has(instance))return result;\n  const memory=Object.values(instance.exports).find(x=>x instanceof WebAssembly.Memory),table=Object.values(instance.exports).find(x=>x instanceof WebAssembly.Table);\n  if(!memory||!table)return result;\n  if(fingerprint!==expectedHash||table.length!==5691){console.warn('[music] Runner fingerprint differs; compatibility hook was not applied.');return result;}\n  const slots={play:1417,stop:1421,create:1501,destroy:1502,stopAll:1446},native={};\n  for(const [key,index] of Object.entries(slots)){native[key]=table.get(index);if(native[key]?.length!==5){console.warn('[music] Unexpected native audio signature; compatibility hook was not applied.');return result;}}\n  attached.add(instance);\n  const streams=new Map(),voices=new Map();\n  const allocate=instance.exports.Sh,scratch=allocate(64),cancelled=new Set();\n  function builtin(name,argc){\n   const bytes=new Uint8Array(memory.buffer,0,Math.min(2097152,memory.buffer.byteLength)),words=new Uint32Array(memory.buffer),pattern=new 16).slice();\n   try{const d=new DataView(memory.buffer);d.setFloat64(pointer,0,true);d.setInt32(pointer+8,0,true);d.setInt32(pointer+12,0,true);gain.callback(...args);}\n   finally{new Uint8Array(memory.buffer,pointer,16).set(saved);}\n  }));\n  function stopCancelledVoice(voice){\n   const record=musicVoices.get(voice);if(gain&&record?.suppressed&&music.get(record.asset)===record){numericCall(gain.callback,[record.asset,0,0]);numericCall(gain.callback,[voice,0,0]);}\n   const d=new DataView(memory.buffer);d.setFloat64(scratch+16,voice,true);d.setInt32(scratch+24,0,true);d.setInt32(scratch+28,0,true);\n   native.stop(scratch,0,0,1,scratch+16);\n  }\n  function cancelPendingVoice(voice){\n   cancelled.add(voice);\n   // Streaming downloads complete asynchronously. The runner can start a voice\n   // after its original stop call; repeat that same stop after loading finishes.\n   for(const delay of [0,50,200,500,1000,2500,5000,10000])setTimeout(()=>stopCancelledVoice(voice),delay);\n  }\n  window.finishCancelledMusicDownloads=()=>{\n   for(const voice of cancelled)for(const delay of [0,50,200,500,1000])setTimeout(()=>stopCancelledVoice(voice),delay);\n  };\n  function number(pointer){if(!pointer||pointer+16>memory.buffer.byteLength)return NaN;const d=new DataView(memory.buffer),type=d.getInt32(pointer+12,true);if(type===0||type===13)return d.getFloat64(pointer,true);if(type===7)return d.getInt32(pointer,true);if(type===10)return Number(d.getBigInt64(pointer,true));return NaN;}\n  function forget(voice){const stream=voices.get(voice);if(stream!==undefined)streams.get(stream)?.delete(voice);voices.delete(voice);}\n  function stopVoice(voice,args){\n   const pointer=args[4];if(!pointer||args[3]<1)return;\n   const saved=new Uint8Array(memory.buffer,pointer,16).slice();\n   try{const d=new DataView(memory.buffer);d.setFloat64(pointer,voice,true);d.setInt32(pointer+8,0,true);d.setInt32(pointer+12,0,true);native.stop(...args);}\n   finally{new Uint8Array(memory.buffer,point   console.log('[music] Voice cleanup installed. Original play arguments and track filenames are preserved.');\n  console.log(gain?'[music] Boss music guard v2 installed (gain callback '+gain.index+').':'[music] Boss music guard unavailable: native gain callback not found.');\n  window.getGameMusicState=()=>[...music].map(([asset,record])=>({asset,name:record.name,generic:record.generic,suppressed:record.suppressed,gain:getGain?numericCall(getGain.callback,[asset]):null,voices:[...record.voices]}));\n  return result;\n }\n function attach(result,fingerprint){const instance=result.instance||result;if(instance?.exports&&Object.values(instance.exports).some(x=>x instanceof WebAssembly.Table)&&fingerprint===expectedHash)ready={result,fingerprint};return result;}\n window.installGameMusicCleanup=()=>{if(ready)install(ready.result,ready.fingerprint);};\n const instantiate=WebAssembly.instantiate;\n WebAssembly.instantiate=async function(bytes,imports){const fingerprint=bytes instanceof WebAssembly.Module?null:hash(bytes);const result=await instantiate.call(this,bytes,imports);return attach(result,await fingerprint);};\n const streaming=WebAssembly.instantiateStreaming;\n if(streaming)WebAssembly.instantiateStreaming=async function(response,imports){const resolved=await response;const fingerprint=hash(await resolved.clone().arrayBuffer());const result=await streaming.call(this,resolved,imports);return attach(result,await fingerprint);};\n})();\n";
const downloadHelper="async function downloadFile(url,label,options){\n const address=String(url),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));\n for(let attempt=0;attempt<3;attempt++){\n  let response;\n  try{response=await originalFetch(url,{...options,...(attempt?{cache:'reload'}:{})});}\n  catch(cause){if(attempt<2){await pause(500*(attempt+1));continue;}throw Error(label+' could not be downloaded.\\nURL: '+address+'\\nOriginal error: '+(cause.message||String(cause)));}\n  if(response.ok)return response;\n  if([403,408,429,500,502,503,504].includes(response.status)&&attempt<2){await response.body?.cancel();await pause(500*(attempt+1));continue;}\n  let detail='';try{detail=(await response.text()).replace(/<[^>]*>/g,' ').replace(/\\s+/g,' ').trim().slice(0,350);}catch(_){}\n  throw Error(label+' download was refused or unavailable (HTTP '+response.status+').\\nURL: '+address+'\\nServer response: '+(detail||'(no explanation returned)'));\n }\n}\n";
