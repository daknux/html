<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <base href="https://cdn.jsdelivr.net/gh/giorgirick2-gif/game-webports-onawebsite@master/yandere-simulator/">

    <title>Yandere Simulator</title>

    <script src="Build/UnityLoader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #unityContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #unityContainer canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #loading-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-family: "Comic Sans MS", cursive;
            text-align: center;
            z-index: 10;
        }
    </style>

    <script>
        let max = 0;
        let done = 0;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                const buffers = [];

                const fetchPart = (index) => {
                    if (index >= fileParts.length) {
                        const blob = new Blob(buffers);
                        resolve(URL.createObjectURL(blob));
                        return;
                    }

                    fetch(fileParts[index])
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(
                                    `Failed to load ${fileParts[index]}`
                                );
                            }
                            return response.arrayBuffer();
                        })
                        .then(buffer => {
                            buffers.push(buffer);
                            done++;

                            const loadingText =
                                document.querySelector("#loading-text");

                            if (loadingText) {
                                loadingText.textContent =
                                    `LOADING... (${done}/${max})`;
                            }

                            fetchPart(index + 1);
                        })
                        .catch(reject);
                };

                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            const parts = [];

            for (let i = start; i <= end; i++) {
                parts.push(`${file}.part${i}`);
            }

            max += parts.length;
            return parts;
        }

        Promise.all([
            mergeFiles(
                getParts("Build/YandereSim.data.unityweb", 1, 5)
            )
        ])
            .then(([dataUrl]) => {
                const config = {
                    companyName: "YandereDev",
                    productName: "YandereSimulator",
                    dataUrl: dataUrl,
                    wasmCodeUrl: "YandereSim.wasm.code.unityweb",
                    wasmFrameworkUrl: "YandereSim.wasm.framework.unityweb",
                    TOTAL_MEMORY: 268435456,
                    graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
                    webglContextAttributes: {
                        preserveDrawingBuffer: false
                    },
                    splashScreenStyle: "Dark",
                    backgroundColor: "#000000",
                    cacheControl: {
                        default: "must-revalidate"
                    }
                };

                const blob = new Blob(
                    [JSON.stringify(config)],
                    { type: "application/json" }
                );

                const blobUrl = URL.createObjectURL(blob);

                UnityLoader.instantiate(
                    "unityContainer",
                    config,
                    {
                        url: blobUrl,
                        Module: {
                            onRuntimeInitialized: () => {
                                const loadingText =
                                    document.querySelector("#loading-text");

                                if (loadingText) {
                                    loadingText.remove();
                                }
                            }
                        }
                    }
                );

                const resize = () => {
                    const container =
                        document.getElementById("unityContainer");

                    container.style.width = `${window.innerWidth}px`;
                    container.style.height = `${window.innerHeight}px`;
                };

                window.addEventListener("resize", resize);
                resize();
            })
            .catch(error => {
                console.error("Game loading failed:", error);

                const loadingText =
                    document.querySelector("#loading-text");

                if (loadingText) {
                    loadingText.textContent =
                        "Failed to load game. Please refresh the page.";
                }
            });
    </script>
</head>

<body>
    <div id="loading-text">
        LOADING...
    </div>

    <div id="unityContainer"></div>
</body>

</html>
