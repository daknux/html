<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Gun Survival | MacVG</title>
  <link class="favicon" rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/fnafben/1234188746455876655@main/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fnafben/1234188746455876655@main/TemplateData/style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #unity-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    #unity-mobile-warning {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      z-index: 10;
      display: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-mobile-warning">
      WebGL builds are not supported on mobile devices.
    </div>
  </div>

  <script>
    var buildUrl = "https://cdn.jsdelivr.net/gh/fnafben/1234188746455876655@main/Build";
    var loaderUrl = buildUrl + "/Shooting.loader.js";
    var config = {
      dataUrl: buildUrl + "/Shooting.data.unityweb",
      frameworkUrl: buildUrl + "/Shooting.framework.js.unityweb",
      codeUrl: buildUrl + "/Shooting.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Mentolatux",
      productName: "Pixel Gun Survival",
      productVersion: "3",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var mobileWarning = document.querySelector("#unity-mobile-warning");

    // Sets both the display size and the drawing resolution to the window size,
    // so the game fills the screen without being stretched or cropped.
    function resizeCanvas() {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
      mobileWarning.style.display = "block";
      setTimeout(() => {
        mobileWarning.style.display = "none";
      }, 5000);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    canvas.style.background = "url('https://cdn.jsdelivr.net/gh/organization-schoogls/y@main/background.gif') center / cover";
    loadingBar.style.display = "block";

    // Merges the data file parts into one file
    async function mergeDataParts() {
      const partFiles = [
        buildUrl + "/Shooting.data.unityweb.part001",
        buildUrl + "/Shooting.data.unityweb.part002",
        buildUrl + "/Shooting.data.unityweb.part003"
      ];

      const blobs = [];

      // Download the parts in order
      for (const part of partFiles) {
        try {
          const response = await fetch(part);
          if (!response.ok) throw new Error("Part failed to load: " + part);
          const blob = await response.blob();
          blobs.push(blob);
        } catch (error) {
          console.error(error);
          return null;
        }
      }

      // Combine the parts
      const mergedBlob = new Blob(blobs, { type: "application/octet-stream" });
      const mergedUrl = URL.createObjectURL(mergedBlob);
      return mergedUrl;
    }

    // Start loading Unity
    mergeDataParts().then((mergedDataUrl) => {
      if (mergedDataUrl) {
        config.dataUrl = mergedDataUrl;
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
          .then((unityInstance) => {
            loadingBar.style.display = "none";
            if (fullscreenButton) {
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }
          })
          .catch((message) => {
            console.error("Unity loading error:", message);
          });
        };
        document.body.appendChild(script);
      } else {
        console.error("File merge failed, Unity cannot load.");
      }
    });
  </script>
</body>
</html>
