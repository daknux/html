<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Gabriel's Awesome Schoolhouse</title>
   <style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #loading-text {
    color: white; font-size: 48px; font-family: cursive;
    text-align: center; margin-top: 20px;
  }
  #unity-container { position: relative; width: 100vw; height: 100vh; }
  #unity-canvas { background: #000; width: 100%; height: 100%; display: block; }
  #unity-loading-bar {
    display: none;
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  #unity-progress-bar-empty {
    width: 141px; height: 18px; margin-top: 10px;
    background: #333; border-radius: 3px; overflow: hidden;
  }
  #unity-progress-bar-full {
    width: 0%; height: 18px;
    background: #ffffff;
    transition: width .15s linear;
  }
</style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
    (function () {
      "use strict";

      var DATA_URL      = "https://quizizz.com/_media/uploadedFiles/a7daf7a4-4fb5-4fc2-802e-fa9e3a88f5bb-v2";
      var WASM_URL      = "https://quizizz.com/_media/uploadedFiles/944172ad-7987-40e1-a8c3-eb8f2f537dd5-v2";
      var FRAMEWORK_URL = "https://quizizz.com/_media/uploadedFiles/50c7e801-8420-47cc-af30-a56acd188d61-v2";
      var LOADER_URL    = "https://quizizz.com/_media/uploadedFiles/0ea8c740-c707-47a3-992d-f872ca211c3c-v2";

      var loadingText     = document.querySelector("#loading-text");
      var canvas          = document.querySelector("#unity-canvas");
      var loadingBar      = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      function unityShowBanner(msg, type) {
        console.log("[" + (type || "info") + "] " + msg);
      }

      var config = {
        dataUrl:            DATA_URL,
        frameworkUrl:       FRAMEWORK_URL,
        codeUrl:            WASM_URL,
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "DaveAnimaNotSpookyGames!",
        productName:        "Gabriel's Awesome Schoolhouse",
        productVersion:     "3.3",
        showBanner:         unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = LOADER_URL;
      script.crossOrigin = "anonymous";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
          if (loadingText) {
            loadingText.textContent = "LOADING... " +
              (progress * 100).toFixed(1) + "%";
          }
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          if (loadingText && loadingText.parentNode) loadingText.remove();
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          if (loadingText) loadingText.textContent = "FAILED: " + message;
          console.error(message);
        });
      };
      script.onerror = function () {
        if (loadingText) loadingText.textContent =
          "FAILED to load GASH.loader.js from " + LOADER_URL;
        console.error("Loader script failed to load or was blocked.");
      };
      document.body.appendChild(script);
    })();
    </script>
  </body>
</html>
