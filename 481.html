<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Baldi's Fun New School Plus Ultimate Edition</title>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/bfnsu/">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: #000;
    }

    #unity-footer {
      display: none !important;
    }

    #unity-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      transition: opacity 0.4s ease;
    }

    #loading-title {
      margin-bottom: 22px;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: bold;
      text-align: center;
      padding: 0 20px;
    }

    #loading-track {
      width: min(420px, 80vw);
      height: 16px;
      background: #252525;
      border: 1px solid #555;
      border-radius: 10px;
      overflow: hidden;
    }

    #loading-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #1685ff, #52c8ff);
      border-radius: 10px;
      transition: width 0.15s ease;
    }

    #loading-info {
      margin-top: 12px;
      width: min(420px, 80vw);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: #ccc;
    }

    #loading-status {
      margin-top: 14px;
      font-size: 13px;
      color: #999;
      text-align: center;
      padding: 0 20px;
    }

    #unity-warning {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 110;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-warning"></div>
  </div>

  <div id="unity-loading-screen">
    <div id="loading-title">Baldi's Fun New School Plus</div>
    <div id="loading-track">
      <div id="loading-fill"></div>
    </div>
    <div id="loading-info">
      <span id="loading-percent">0%</span>
      <span id="loading-mb">0 MB / calculating...</span>
    </div>
    <div id="loading-status">Preparing game files...</div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const warningBanner = document.querySelector("#unity-warning");
    const loadingScreen = document.querySelector("#unity-loading-screen");
    const loadingFill = document.querySelector("#loading-fill");
    const loadingPercent = document.querySelector("#loading-percent");
    const loadingMB = document.querySelector("#loading-mb");
    const loadingStatus = document.querySelector("#loading-status");

    let downloadLoaded = 0;
    let downloadTotal = 0;
    let unityProgress = 0;
    let unityStarted = false;

    function formatMB(bytes) {
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function updateLoading(percent, status, mbText) {
      const value = Math.max(0, Math.min(100, percent));
      loadingFill.style.width = value + "%";
      loadingPercent.textContent = Math.floor(value) + "%";
      loadingStatus.textContent = status;

      if (mbText) {
        loadingMB.textContent = mbText;
      }
    }

    function updateDownloadProgress() {
      if (downloadTotal > 0) {
        const percent = downloadLoaded / downloadTotal * 70;
        updateLoading(
          percent,
          "Downloading game files...",
          formatMB(downloadLoaded) + " / " + formatMB(downloadTotal)
        );
      } else {
        updateLoading(2, "Downloading game files...", "Calculating size...");
      }
    }

    function resizeGame() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
    }

    window.addEventListener("resize", resizeGame);
    window.addEventListener("orientationchange", resizeGame);
    resizeGame();

    function unityShowBanner(msg, type) {
      const div = document.createElement("div");
      div.textContent = msg;
      div.style.cssText = type === "error"
        ? "background:red;padding:10px;color:white;"
        : "background:yellow;padding:10px;color:black;";

      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    window.mergedBlobUrls = {};
    window.assetsReady = false;

    async function mergeSplitFile(fileUrlBase, numParts) {
      const partUrls = Array.from(
        { length: numParts },
        (_, i) => `${fileUrlBase}.part${i + 1}`
      );

      try {
        updateLoading(
          2,
          "Downloading " + fileUrlBase.split("/").pop() + "...",
          "Downloading parts..."
        );

        const responses = await Promise.all(
          partUrls.map(async url => {
            const response = await fetch(url);

            if (!response.ok) {
              throw new Error("Failed to download " + url);
            }

            const buffer = await response.arrayBuffer();
            downloadLoaded += buffer.byteLength;
            downloadTotal += buffer.byteLength;
            updateDownloadProgress();

            return buffer;
          })
        );

        const combinedBlob = new Blob(responses, {
          type: "application/octet-stream"
        });

        return URL.createObjectURL(combinedBlob);
      } catch (error) {
        return null;
      }
    }

    function setupXHRInterceptor() {
      if (window.xhrInterceptorInstalled) return;

      const originalOpen = XMLHttpRequest.prototype.open;
      const originalSend = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        let finalUrl = url;
        let decodedUrl = url;

        try {
          decodedUrl = decodeURIComponent(url);
        } catch (error) {}

        for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
          if (
            url.includes(encodeURIComponent(filename)) ||
            decodedUrl.includes(filename) ||
            url.includes(filename)
          ) {
            finalUrl = blobUrl;
            break;
          }
        }

        return originalOpen.call(this, method, finalUrl, ...args);
      };

      XMLHttpRequest.prototype.send = function(...args) {
        const xhr = this;

        if (!window.assetsReady) {
          const checkReady = setInterval(() => {
            if (window.assetsReady) {
              clearInterval(checkReady);
              originalSend.apply(xhr, args);
            }
          }, 50);
          return;
        }

        return originalSend.apply(this, args);
      };

      window.xhrInterceptorInstalled = true;
    }

    function setupFetchInterceptor() {
      if (window.fetchInterceptorInstalled) return;

      const originalFetch = window.fetch;

      window.fetch = function(url, ...args) {
        let finalUrl = url;
        let decodedUrl = "";

        if (typeof url === "string") {
          try {
            decodedUrl = decodeURIComponent(url);
          } catch (error) {
            decodedUrl = url;
          }
        }

        for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
          if (
            typeof url === "string" &&
            (
              url.includes(encodeURIComponent(filename)) ||
              decodedUrl.includes(filename) ||
              url.includes(filename)
            )
          ) {
            finalUrl = blobUrl;
            break;
          }
        }

        return originalFetch.call(this, finalUrl, ...args);
      };

      window.fetchInterceptorInstalled = true;
    }

    async function prepareGameAssets() {
      try {
        window.assetsReady = false;
        delete window.xhrInterceptorInstalled;
        delete window.fetchInterceptorInstalled;
        window.mergedBlobUrls = {};

        setupXHRInterceptor();
        setupFetchInterceptor();

        const filesToMerge = [
          {
            filename: "Build/BFNSPUE Alpha 6 Part 2b WebGL.data",
            parts: 9
          },
          {
            filename: "Build/BFNSPUE Alpha 6 Part 2b WebGL.wasm",
            parts: 2
          }
        ];

        updateLoading(1, "Preparing game files...", "Calculating size...");

        for (const file of filesToMerge) {
          const blobUrl = await mergeSplitFile(file.filename, file.parts);

          if (blobUrl) {
            window.mergedBlobUrls[file.filename] = blobUrl;
          }
        }

        window.assetsPrepared = true;
        window.assetsReady = true;
      } catch (error) {
        window.assetsPrepared = false;
        window.assetsReady = true;
      }
    }

    prepareGameAssets().then(() => {
      const buildUrl = "Build";
      const loaderUrl =
        buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.loader.js";

      const config = {
        dataUrl: buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.data",
        frameworkUrl: buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.framework.js",
        codeUrl: buildUrl + "/BFNSPUE Alpha 6 Part 2b WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "JohnsterSpaceGames",
        productName: "Baldi's Fun New School Plus Ultimate Edition",
        productVersion: "0.2.5b",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        unityShowBanner("WebGL builds are not supported on mobile devices.");
      }

      canvas.style.background =
        "url('" + buildUrl +
        "/BFNSPUE Alpha 6 Part 2b WebGL.jpg') center / cover";

      updateLoading(
        70,
        "Starting Unity...",
        downloadTotal > 0
          ? formatMB(downloadLoaded) + " downloaded"
          : "Files ready"
      );

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          unityStarted = true;
          unityProgress = progress;

          const percent = 70 + progress * 30;

          updateLoading(
            percent,
            progress < 1 ? "Loading game..." : "Finishing up...",
            downloadTotal > 0
              ? formatMB(downloadLoaded) + " downloaded"
              : "Loading Unity assets..."
          );
        }).then(() => {
          updateLoading(100, "Ready!", "Loaded");
          setTimeout(() => {
            loadingScreen.style.opacity = "0";
            setTimeout(() => loadingScreen.remove(), 400);
          }, 250);
          resizeGame();
        }).catch(message => {
          updateLoading(
            100,
            "Unable to load the game.",
            "Check your connection and try again."
          );
          console.error(message);
        });
      };

      script.onerror = () => {
        updateLoading(
          100,
          "Failed to load Unity.",
          "Please refresh and try again."
        );
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
