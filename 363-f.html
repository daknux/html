<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/xxskidxx69420-ai/isthatagubbywebportheh/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>IS THAT A GUBBY</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #loading-text {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font: 48px cursive;
      background: #000;
      z-index: 10;
    }

    #unity-container,
    #unity-canvas {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0;
      padding: 0;
    }

    #unity-container {
      position: fixed;
      inset: 0;
    }

    #unity-canvas {
      display: block;
      background: #000;
    }

    #unity-loading-bar {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40%;
      max-width: 500px;
      transform: translate(-50%, -50%);
    }

    #unity-progress-bar-empty {
      height: 8px;
      background: #444;
      border-radius: 4px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0;
      height: 100%;
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="loading-text">LOADING...</div>

  <div id="unity-container" hidden>
    <canvas id="unity-canvas"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    let loadedBytes = 0;

    const loadingText = document.getElementById("loading-text");
    const container = document.getElementById("unity-container");
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const progressBar = document.getElementById("unity-progress-bar-full");

    async function fetchFile(url) {
      const response = await fetch(url);

      if (!response.ok)
        throw new Error(`Failed to load ${url}`);

      const reader = response.body.getReader();
      const chunks = [];
      let size = 0;

      while (true) {
        const { done, value } = await reader.read();

        if (done) break;

        chunks.push(value);
        size += value.length;
        loadedBytes += value.length;

        loadingText.textContent =
          `LOADING... ${(loadedBytes / 1048576).toFixed(2)} MB / 120.00 MB`;
      }

      const buffer = new Uint8Array(size);

      let offset = 0;

      for (const chunk of chunks) {
        buffer.set(chunk, offset);
        offset += chunk.length;
      }

      return buffer;
    }

    async function merge(file, parts) {
      const buffers = await Promise.all(
        Array.from(
          { length: parts },
          (_, i) => fetchFile(`${file}.part${i + 1}`)
        )
      );

      return URL.createObjectURL(new Blob(buffers));
    }

    (async () => {
      try {
        const dataUrl = await merge("./Build/webporboi1.data", 2);
        const codeUrl = await merge("./Build/webporboi1.wasm", 3);

        container.hidden = false;

        const config = {
          dataUrl,
          frameworkUrl: "./Build/webporboi1.framework.js",
          codeUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "IS THAT A GUBBY",
          productVersion: "2.2"
        };

        const script = document.createElement("script");
        script.src = "./Build/webporboi1.loader.js";

        script.onload = () => {
          createUnityInstance(canvas, config, progress => {
            progressBar.style.width = `${progress * 100}%`;
          })
          .then(() => {
            loadingText.remove();
            loadingBar.remove();
          })
          .catch(error => {
            loadingText.textContent = "ERROR LOADING: " + error;
          });
        };

        document.body.appendChild(script);
      } catch (error) {
        loadingText.textContent = "ERROR LOADING: " + error.message;
      }
    })();
  </script>
</body>
</html>
