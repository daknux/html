<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doki Doki Literature Club! Plus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html { background: #000; font-family: sans-serif; }
  body, html { margin: 0; padding: 0; overscroll-behavior: none; }
  #canvas, #overlayDiv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0 none; }
  #canvas { background: #000; }
  .visible { visibility: visible; opacity: 1.0; transition: opacity .1s linear; }
  .hidden { visibility: hidden; opacity: 0; transition: visibility 0s .25s, opacity .25s linear; }
  #statusDiv, #inputDiv {
    background: rgba(0,0,0,0.75); width: 50%; margin: auto; min-width: 340px; padding: 10px;
    position: absolute; top: 0; left: 0; right: 0; border-radius: 0 0 5px 5px;
  }
  #statusTextDiv { overflow: auto; max-height: 40vh; color: #ccc; font-size: 14px; }
  #statusProgress { display: none; width: 100%; }
  #inputDiv { width: 65%; padding-left: 10px; padding-right: 20px; }
  #inputPrompt { color: #eee; font-size: 150%; margin-bottom: 1em; margin-top: 1em; }
  #inputText { width: 100%; font-size: 175%; padding: 5px; background: inherit; color: #eee; box-sizing: border-box; }
  #inputText:focus { color: #fff; }
  #presplash { position: absolute; top: 0; left: 0; display: block; margin: auto; width: 100%; height: 100%; object-fit: contain; }
  #ContextContainer { position: absolute; left: 0; top: 0; color: white; z-index: 100; }
  #ContextContainer.shown { background: rgba(0,0,0,0.5); border-radius: 0 0 5px 0; }
  #ContextButton {
    text-decoration: none; color: lightgrey; font-size: xx-large; cursor: pointer;
    user-select: none; -moz-user-select: none; padding: 10px 10px; opacity: .75;
  }
  #ContextButton:focus { outline: none; color: #fff; opacity: 1.0; }
  #ContextMenu a {
    text-decoration: none; color: lightgrey; background: #444; height: 48px; width: 250px;
    border-radius: 5px; border: 1px solid lightgrey;
    display: flex; align-items: center; justify-content: center;
    margin: 5px 5px; opacity: 1.0;
  }
  #ContextMenu a:hover { background: #666; color: #fff; }
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #e8e8f0; gap: 14px;
    transition: opacity .4s ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #loader .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid #2a2a3a; border-top-color: #f26b8a;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .title { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  #loader .status { font-size: 13px; color: #99a; min-height: 18px; text-align: center; padding: 0 20px; }
  #loader .bar-wrap { width: min(420px, 80vw); height: 8px; background: #1a1a2a; border-radius: 4px; overflow: hidden; }
  #loader .bar { height: 100%; width: 0%; background: #f26b8a; transition: width .15s ease; }
  #loader .mb { font-size: 12px; color: #778; font-variant-numeric: tabular-nums; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="overlayDiv"></div>
<img id="presplash">

<div id="ContextContainer">
  <a id="ContextButton">&#8801;</a><br>
  <div id="ContextMenu" style="display: none;">
    <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip" style="display:none">
    <a href="javascript:document.getElementById('ID_SavegamesImport').click();">Import Saves</a>
    <a href="javascript:onSavegamesExport();">Export Saves</a>
    <a href="javascript:FSDownload('/log.txt', 'text/plain');">Download Log</a>
  </div>
</div>

<div id="statusDiv" class="hidden">
  <div id="statusTextDiv"></div>
  <progress id="statusProgress" value="0" max="100"></progress>
</div>
<div id="inputDiv" class="hidden">
  <form id="inputForm">
    <div id="inputPrompt"></div>
    <input id="inputText" type="text">
  </form>
</div>

<div id="loader">
  <div class="spinner"></div>
  <div class="title">Doki Doki Literature Club! Plus</div>
  <div class="status" id="loaderStatus">Preparing…</div>
  <div class="bar-wrap"><div class="bar" id="loaderBar"></div></div>
  <div class="mb" id="loaderMB"></div>
</div>

<script>
(async function () {
  'use strict';

  const ZIP_URL = 'https://quizizz.com/_media/uploadedFiles/43b3db23-8e4e-4633-8d57-0548fa633c91-v2';

  const loaderEl = document.getElementById('loader');
  const statusEl = document.getElementById('loaderStatus');
  const barEl = document.getElementById('loaderBar');
  const mbEl = document.getElementById('loaderMB');

  const setStatus = (t) => statusEl.textContent = t;
  const setProgress = (f) => barEl.style.width = Math.max(0, Math.min(100, f * 100)) + '%';
  const fmtMB = (b) => (b / 1048576).toFixed(1) + ' MB';

  function hideLoader() {
    if (!loaderEl) return;
    loaderEl.style.opacity = '0';
    loaderEl.style.pointerEvents = 'none';
    setTimeout(() => { if (loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl); }, 500);
  }

  const MIME = {
    js: 'application/javascript', mjs: 'application/javascript', json: 'application/json',
    wasm: 'application/wasm', data: 'application/octet-stream', zip: 'application/zip',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp',
    gif: 'image/gif', svg: 'image/svg+xml', mp3: 'audio/mpeg', ogg: 'audio/ogg',
    wav: 'audio/wav', opus: 'audio/opus', webm: 'video/webm', mp4: 'video/mp4',
    ttf: 'font/ttf', otf: 'font/otf', woff: 'font/woff', woff2: 'font/woff2',
    css: 'text/css', html: 'text/html', txt: 'text/plain', toml: 'text/plain',
    rpyc: 'application/octet-stream', rpyb: 'application/octet-stream'
  };
  const mimeFor = (n) => {
    const d = n.lastIndexOf('.');
    return d < 0 ? 'application/octet-stream' : (MIME[n.substring(d + 1).toLowerCase()] || 'application/octet-stream');
  };

  const IMG_EXTS = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp'];
  const AUD_EXTS = ['mp3', 'ogg', 'wav', 'opus'];
  const VID_EXTS = ['mp4', 'webm', 'ogv', 'm4v'];

  const FALLBACK_PNG_BYTES = Uint8Array.from(
    atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='),
    c => c.charCodeAt(0)
  );

  const fileMap = new Map();
  const placeholderMap = new Map();
  const innerZipCache = new Map();
  let innerZip = null;
  let missingImageBlob = null;
  let silenceBlob = null;

  function cleanPath(u) {
    if (!u) return '';
    let s = String(u).trim();
    if (s.startsWith('blob:')) s = s.substring(5);
    if (s.includes('://')) {
      try { s = new URL(s).pathname; } catch (e) {}
    }
    s = s.split('?')[0].split('#')[0];
    s = s.replace(/^\/+/, '').replace(/^(\.\.\/)+/, '').replace(/^\.\//, '');
    return s.toLowerCase();
  }

  function lookupMulti(map, clean) {
    if (!clean) return null;
    if (map.has(clean)) return map.get(clean);
    if (clean.startsWith('game/') && map.has(clean.substring(5))) return map.get(clean.substring(5));
    if (!clean.startsWith('game/') && map.has('game/' + clean)) return map.get('game/' + clean);
    return null;
  }

  function findInMap(map, clean) {
    const hit = lookupMulti(map, clean);
    if (hit) return hit;
    const name = clean.split('/').pop();
    if (!name) return null;
    for (const [k, b] of map.entries()) {
      if (k === name || k.endsWith('/' + name)) return b;
    }
    return null;
  }

  function findFileBlob(target) {
    if (!target || typeof target !== 'string') return null;
    if (target.startsWith('data:')) return null;
    const clean = cleanPath(target);
    if (!clean) return null;
    return findInMap(fileMap, clean) || findInMap(placeholderMap, clean);
  }

  function fallbackForExtension(clean) {
    const dot = clean.lastIndexOf('.');
    if (dot < 0) return null;
    const ext = clean.substring(dot + 1);
    if (IMG_EXTS.includes(ext)) {
      return missingImageBlob || new Blob([FALLBACK_PNG_BYTES], { type: 'image/png' });
    }
    if (AUD_EXTS.includes(ext)) {
      return silenceBlob || new Blob([], { type: 'audio/ogg' });
    }
    if (VID_EXTS.includes(ext)) {
      return new Blob([], { type: 'video/' + (ext === 'webm' ? 'webm' : ext === 'ogv' ? 'ogg' : 'mp4') });
    }
    return null;
  }

  function resolveTarget(target) {
    if (!target || typeof target !== 'string') return null;
    if (target.startsWith('data:')) return null;
    const clean = cleanPath(target);
    if (!clean) return null;
    return findInMap(fileMap, clean) || findInMap(placeholderMap, clean) || fallbackForExtension(clean);
  }

  async function extractFromInnerZip(rawPath) {
    if (!innerZip) return null;
    const clean = cleanPath(rawPath);
    if (!clean) return null;
    const candidates = [];
    if (clean.startsWith('game/')) candidates.push(clean.substring(5));
    else candidates.push(clean, 'game/' + clean);
    candidates.push('_placeholders/' + (clean.startsWith('game/') ? clean.substring(5) : clean));
    for (const cand of candidates) {
      if (innerZipCache.has(cand)) return innerZipCache.get(cand);
      const entry = innerZip.files[cand];
      if (entry && !entry.dir) {
        try {
          const raw = await entry.async('blob');
          const typed = new Blob([raw], { type: mimeFor(cand) });
          innerZipCache.set(cand, typed);
          return typed;
        } catch (e) {}
      }
    }
    const name = clean.split('/').pop();
    if (name) {
      for (const key of Object.keys(innerZip.files)) {
        const f = innerZip.files[key];
        if (f.dir) continue;
        if (key === name || key.endsWith('/' + name)) {
          try {
            const raw = await f.async('blob');
            const typed = new Blob([raw], { type: mimeFor(key) });
            innerZipCache.set(key, typed);
            return typed;
          } catch (e) {}
        }
      }
    }
    return null;
  }

  try {
    setStatus('Downloading game…');
    const resp = await fetch(ZIP_URL);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) {
        setProgress((received / total) * 0.85);
        mbEl.textContent = fmtMB(received) + ' / ' + fmtMB(total);
      } else {
        mbEl.textContent = fmtMB(received);
      }
    }
    const buf = new Uint8Array(received);
    let off = 0;
    for (const c of chunks) { buf.set(c, off); off += c.length; }
    chunks.length = 0;

    setStatus('Extracting…');
    const zip = await JSZip.loadAsync(buf.buffer);
    const names = Object.keys(zip.files);
    let prefix = '';
    for (const probe of ['renpy.js', 'renpy-pre.js']) {
      const hit = names.find(n => n.toLowerCase().endsWith(probe));
      if (hit) { prefix = hit.slice(0, hit.length - probe.length); break; }
    }

    const entries = [];
    for (const name of names) {
      const entry = zip.files[name];
      if (entry.dir) continue;
      let path = name;
      if (prefix && path.startsWith(prefix)) path = path.slice(prefix.length);
      path = path.replace(/^\/+/, '').toLowerCase();
      if (path) entries.push({ path, entry });
    }

    let done = 0;
    for (const { path, entry } of entries) {
      if (path === 'game.zip') setStatus('Unpacking game archive…');
      const blob = await entry.async('blob');
      fileMap.set(path, blob.type ? blob : new Blob([blob], { type: mimeFor(path) }));
      done++;
      setProgress(0.85 + (done / entries.length) * 0.05);
      mbEl.textContent = done + ' / ' + entries.length + ' files';
    }

    const gzBlob = fileMap.get('game.zip');
    if (gzBlob) {
      setStatus('Indexing game archive…');
      try { innerZip = await JSZip.loadAsync(gzBlob); } catch (e) { console.error('innerZip load failed', e); }

      if (innerZip) {
        try {
          const mi = innerZip.file('renpy/common/_missing_image.png');
          if (mi) missingImageBlob = new Blob([await mi.async('blob')], { type: 'image/png' });
        } catch (e) {}
        try {
          const sl = innerZip.file('renpy/common/_silence.ogg');
          if (sl) silenceBlob = new Blob([await sl.async('blob')], { type: 'audio/ogg' });
        } catch (e) {}

        setStatus('Preloading placeholders…');
        const phEntries = [];
        for (const name of Object.keys(innerZip.files)) {
          const f = innerZip.files[name];
          if (f.dir) continue;
          if (!name.startsWith('_placeholders/')) continue;
          phEntries.push({ name, f });
        }
        let pidx = 0;
        const CONCURRENCY = 16;
        async function worker() {
          while (pidx < phEntries.length) {
            const i = pidx++;
            const { name, f } = phEntries[i];
            try {
              const raw = await f.async('blob');
              const stripped = name.substring('_placeholders/'.length).toLowerCase();
              placeholderMap.set(stripped, new Blob([raw], { type: mimeFor(name) }));
            } catch (e) {}
            if (i % 100 === 0) {
              setProgress(0.90 + (i / phEntries.length) * 0.10);
              mbEl.textContent = i + ' / ' + phEntries.length + ' placeholders';
            }
          }
        }
        const workers = [];
        for (let i = 0; i < CONCURRENCY; i++) workers.push(worker());
        await Promise.all(workers);
      }
    }
    setProgress(1);

    window.__ddlc = {
      files: fileMap.size,
      placeholders: placeholderMap.size,
      innerZip: !!innerZip,
      missingImage: !!missingImageBlob,
      silence: !!silenceBlob
    };

    window.gameZipURL = 'game.zip';

    const nativeFetch = window.fetch;
    window.fetch = async function (input, init) {
      const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
      if (urlStr && !urlStr.startsWith('blob:') && !urlStr.startsWith('data:')) {
        let blob = findFileBlob(urlStr);
        if (!blob) {
          try { blob = await extractFromInnerZip(urlStr); } catch (e) {}
        }
        if (!blob) blob = fallbackForExtension(cleanPath(urlStr));
        if (blob) return new Response(blob, {
          status: 200,
          headers: { 'Content-Type': blob.type || 'application/octet-stream', 'Content-Length': String(blob.size) }
        });
      }
      return nativeFetch.apply(this, arguments);
    };

    const nativeXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      const urlStr = (url && typeof url === 'object' && 'href' in url) ? url.href : String(url || '');
      if (urlStr && !urlStr.startsWith('blob:') && !urlStr.startsWith('data:')) {
        const blob = resolveTarget(urlStr);
        if (blob) {
          const args = Array.prototype.slice.call(arguments);
          args[1] = URL.createObjectURL(blob);
          return nativeXhrOpen.apply(this, args);
        }
      }
      return nativeXhrOpen.apply(this, arguments);
    };

    const nativeSetAttribute = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (name, value) {
      if (name && String(name).toLowerCase() === 'src' && typeof value === 'string' && !value.startsWith('blob:') && !value.startsWith('data:')) {
        const blob = findFileBlob(value);
        if (blob) value = URL.createObjectURL(blob);
      }
      return nativeSetAttribute.call(this, name, value);
    };

    const presplash = document.getElementById('presplash');
    const psBlob = findFileBlob('web-presplash.jpg');
    if (presplash && psBlob) presplash.src = URL.createObjectURL(psBlob);

    const scriptSrcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');

    function injectScript(blob, fakeName, async) {
      return new Promise((resolve) => {
        const s = document.createElement('script');
        const realUrl = URL.createObjectURL(blob);
        scriptSrcDesc.set.call(s, realUrl);
        Object.defineProperty(s, 'src', {
          get() { return 'https://renpy.local/' + fakeName; },
          configurable: true
        });
        if (async) s.async = true; else s.async = false;
        s.onload = resolve;
        s.onerror = resolve;
        document.head.appendChild(s);
      });
    }

    setStatus('Starting game…');
    const preBlob = findFileBlob('renpy-pre.js');
    if (!preBlob) throw new Error('renpy-pre.js missing');
    await injectScript(preBlob, 'renpy-pre.js', false);

    const mainBlob = findFileBlob('renpy.js');
    if (!mainBlob) throw new Error('renpy.js missing');
    injectScript(mainBlob, 'renpy.js', true);

    const statusDiv = document.getElementById('statusDiv');
    const hideOnReady = () => {
      if (statusDiv && (statusDiv.classList.contains('visible') || statusDiv.classList.contains('shown'))) {
        hideLoader();
        return true;
      }
      return false;
    };
    if (!hideOnReady()) {
      const obs = new MutationObserver(() => { if (hideOnReady()) obs.disconnect(); });
      if (statusDiv) obs.observe(statusDiv, { attributes: true, attributeFilter: ['class'] });
      setTimeout(() => { obs.disconnect(); hideLoader(); }, 5000);
    }
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + (err && err.message ? err.message : String(err)));
  }
})();
</script>
</body>
</html>
