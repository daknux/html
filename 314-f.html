<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unity Web Player | Baldi's Basics Squared Classic</title>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #0B0018;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      display: none;
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url("https://media.blooket.com/raw/upload/qiodbxfg1wnk1zopvecc.png")
        no-repeat center;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      margin-left: 6.5px;
      background: url("https://media.blooket.com/raw/upload/ikwzh9fak9oawkzjqums.png")
        no-repeat center;
    }

    #unity-progress-bar-full {
      width: 0;
      height: 18px;
      margin-top: 10px;
      background: url("https://media.blooket.com/raw/upload/xocv251dt1w0c7sbajam.png")
        no-repeat center;
    }

    #unity-warning {
      position: absolute;
      top: 5%;
      left: 50%;
      display: none;
      padding: 10px;
      transform: translateX(-50%);
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.innerHTML = message;

      if (type === "error") {
        div.style = "background:red;padding:10px;";
      } else if (type === "warning") {
        div.style = "background:yellow;padding:10px;";

        setTimeout(() => {
          div.remove();

          if (!warningBanner.children.length) {
            warningBanner.style.display = "none";
          }
        }, 5000);
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";
    }

    const loaderUrl =
      "https://media.blooket.com/raw/upload/tsopemgaihvgmxjmrlmb.js-svg";

    const config = {
      arguments: [],
      dataUrl:
        "https://media.blooket.com/raw/upload/xvp04tbvvokyetlhhhyb.gz",
      frameworkUrl:
        "https://media.blooket.com/raw/upload/elrlowmnuqpmbogk1idu.gz",
      codeUrl:
        "https://media.blooket.com/raw/upload/o3eojjsubhhhgtid3fgw.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "None",
      productName: "Baldi's Basics Squared",
      productVersion: "0.0.7f",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");

      meta.name = "viewport";
      meta.content =
        "width=device-width,height=device-height,initial-scale=1.0,user-scalable=no";

      document.head.appendChild(meta);

      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    loadingBar.style.display = "block";

    fetch(loaderUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(response.status);
        }

        return response.text();
      })
      .then(source => {
        const matches = [...source.matchAll(/<svg\b[^>]*>/gi)];

        const start =
          matches.length >= 2
            ? matches[1].index + matches[1][0].length
            : matches.length === 1
              ? matches[0].index + matches[0][0].length
              : 0;

        const script = document.createElement("script");
        script.textContent = source.substring(start);
        document.body.appendChild(script);

        createUnityInstance(canvas, config, progress => {
          progressBar.style.width = `${100 * progress}%`;
        })
          .then(() => {
            loadingBar.style.display = "none";
          })
          .catch(error => {
            alert(error);
          });
      })
      .catch(error => {
        console.error("JS-SVG loader error:", error);
        alert(error);
      });
  </script>
</body>
</html>
