<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,user-scalable=no">
<title>Willy's Workplace</title>

<style>
html,body{
	margin:0;
	width:100%;
	height:100%;
	overflow:hidden;
	background:#000
}

body{touch-action:none}

canvas{
	display:block;
	width:100%;
	height:100%
}

#status{
	position:absolute;
	inset:0;
	display:flex;
	align-items:center;
	justify-content:center;
	visibility:hidden;
	pointer-events:none
}

#spinner{
	width:36px;
	height:36px;
	border:4px solid #444;
	border-top-color:#fff;
	border-radius:50%;
	animation:spin .8s linear infinite
}

@keyframes spin{
	to{transform:rotate(360deg)}
}

#progress{
	width:366px;
	height:7px;
	padding:1px;
	background:#38363a;
	border:1px solid #444;
	border-radius:2px
}

#progress>div{
	width:0;
	height:100%;
	background:#fff;
	transition:width .3s
}

#error{
	padding:8px 12px;
	color:#fff;
	font:14px Arial,sans-serif;
	background:#333;
	border:1px solid #555;
	border-radius:4px
}

@media(orientation:portrait){
	#progress{width:61.8%}
}
</style>
</head>

<body>

<canvas id="canvas">
	HTML5 canvas is not supported by your browser.
	Please update your browser or try a different one.
</canvas>

<div id="status">
	<div id="spinner"></div>
	<div id="progress"><div></div></div>
	<div id="error"></div>
</div>

<script>
const BASE_URL="https://media.blooket.com/raw/upload/";
const LOADER_URL=BASE_URL+"qoxupxakiq5bndv6hylu.js-svg";
const PACK_URL=BASE_URL+"fvhelbtgbt7e5prv2kud.pck";
const WASM_URL=BASE_URL+"cdgjqbjfxea0mkffu2z8.wasm";

const GODOT_CONFIG={
	args:[],
	canvasResizePolicy:2,
	executable:"index",
	experimentalVK:false,
	focusCanvas:true,
	gdnativeLibs:[],
	mainPack:PACK_URL,
	fileSizes:{
		[PACK_URL]:42459792,
		[WASM_URL]:13793958
	}
};

const originalFetch=window.fetch;

window.fetch=function(resource,init){
	const url=typeof resource==="string"
		?resource
		:resource.url;

	if(url?.endsWith("index.wasm"))
		resource=WASM_URL;

	return originalFetch.call(this,resource,init);
};

const status=document.getElementById("status");
const spinner=document.getElementById("spinner");
const progress=document.getElementById("progress");
const bar=progress.firstElementChild;
const error=document.getElementById("error");

progress.style.display="none";
error.style.display="none";

function show(mode){
	spinner.style.display=mode==="spinner"?"block":"none";
	progress.style.display=mode==="progress"?"block":"none";
	error.style.display=mode==="error"?"block":"none";

	if(mode==="hidden"){
		status.style.visibility="hidden";
	}else{
		status.style.visibility="visible";
	}
}

function fail(err){
	error.textContent=err.message||err;
	console.error(err);
	show("error");
}

async function loadJsSvg(url){
	const response=await fetch(url);

	if(!response.ok)
		throw new Error(`Failed to load loader: HTTP ${response.status}`);

	const source=await response.text();
	const matches=[...source.matchAll(/<svg\b[^>]*>/gi)];

	if(!matches.length)
		return source;

	const index=matches.length>=2
		?matches[1].index+matches[1][0].length
		:matches[0].index+matches[0][0].length;

	return source.substring(index);
}

(async()=>{
	try{
		const loaderSource=await loadJsSvg(LOADER_URL);

		const script=document.createElement("script");
		script.textContent=loaderSource;
		document.body.appendChild(script);

		if(!Engine.isWebGLAvailable()){
			fail("WebGL not available");
			return;
		}

		show("spinner");

		const engine=new Engine(GODOT_CONFIG);

		engine.startGame({
			onProgress(current,total){
				if(total>0){
					bar.style.width=current/total*100+"%";
					show("progress");

					if(current===total){
						setTimeout(()=>show("spinner"),500);
					}
				}else{
					show("spinner");
				}
			}
		}).then(
			()=>{
				status.style.visibility="hidden";
				status.style.display="none";
			},
			fail
		);
	}catch(err){
		fail(err);
	}
})();
</script>

</body>
</html>
