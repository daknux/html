<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantsVsZombiesRH</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; color: #fff; font-family: system-ui, sans-serif; }
    #unity-canvas { width: 100vw; height: 100vh; display: block; background: #000; }
    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; background: #000; z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.12);
      border-left-color: #7dbb4b;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #progress-wrap {
      margin-top: 22px; width: 260px; height: 8px;
      background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
    }
    #progress-bar {
      height: 100%; width: 0%; background: #7dbb4b;
      transition: width 0.2s linear;
    }
    #status-text {
      margin-top: 16px; font-size: 14px; opacity: 0.85;
    }
    #mb-text {
      margin-top: 6px; font-size: 12px; opacity: 0.55; font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="status-text">Preparing...</div>
    <div id="mb-text"></div>
  </div>

  <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

  <script>
  (async function () {
    var LOADER_URL = "https://quizizz.com/_media/uploads/0c81aa74-422f-49d3-84af-80069eec00f6-v2";
    var DATA_URL = "https://quizizz.com/_media/uploads/6a3fda15-50c0-468d-9012-9518efe34dc9-v2";
    var FRAMEWORK_URL = "https://quizizz.com/_media/uploads/3037d685-1af9-467c-9609-073efc2428b5-v2";
    var WASM_URL = "https://quizizz.com/_media/uploads/0542393d-766c-4335-956d-a5c06ff8b68c-v2";

    var screenEl = document.getElementById('loading-screen');
    var barEl = document.getElementById('progress-bar');
    var statusEl = document.getElementById('status-text');
    var mbEl = document.getElementById('mb-text');

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.head.appendChild(meta);
    }

    function fmtMB(bytes) {
      return (bytes / (1024 * 1024)).toFixed(1);
    }

    async function getContentLength(url) {
      try {
        var res = await fetch(url, { method: 'HEAD' });
        if (!res.ok) return 0;
        return parseInt(res.headers.get('Content-Length') || '0', 10);
      } catch (e) {
        return 0;
      }
    }

    try {
      statusEl.textContent = 'Preparing...';

      var loaderRes = await fetch(LOADER_URL);
      if (!loaderRes.ok) throw new Error('Loader fetch failed: ' + loaderRes.status);
      var loaderText = await loaderRes.text();
      if (loaderText.trimStart().startsWith('<')) throw new Error('Loader returned HTML instead of JS');

      statusEl.textContent = 'Measuring...';

      var sizes = await Promise.all([
        getContentLength(DATA_URL),
        getContentLength(FRAMEWORK_URL),
        getContentLength(WASM_URL)
      ]);
      var totalBytes = sizes[0] + sizes[1] + sizes[2];

      var loaderBlobUrl = URL.createObjectURL(new Blob([loaderText], { type: 'application/javascript' }));
      var script = document.createElement('script');
      script.src = loaderBlobUrl;
      script.onload = function () {
        statusEl.textContent = 'Loading...';

        var onProgress = function (progress) {
          if (typeof progress !== 'number' || isNaN(progress)) progress = 0;
          if (progress < 0) progress = 0;
          if (progress > 1) progress = 1;
          barEl.style.width = (progress * 100) + '%';
          if (totalBytes > 0) {
            mbEl.textContent = fmtMB(progress * totalBytes) + ' / ' + fmtMB(totalBytes) + ' MB';
          } else {
            mbEl.textContent = Math.round(progress * 100) + '%';
          }
        };

        createUnityInstance(document.querySelector('#unity-canvas'), {
          dataUrl: DATA_URL,
          frameworkUrl: FRAMEWORK_URL,
          codeUrl: WASM_URL,
          companyName: "LanPiaoPiao",
          productName: "PlantsVsZombiesRH",
          productVersion: "1.0"
        }, onProgress).then(function () {
          screenEl.classList.add('hidden');
          setTimeout(function () { screenEl.style.display = 'none'; }, 500);
        }).catch(function (e) {
          console.error('createUnityInstance failed:', e);
          statusEl.textContent = 'Load failed: ' + (e && e.message ? e.message : e);
        });
      };
      script.onerror = function () {
        statusEl.textContent = 'Failed to load Unity loader script';
      };
      document.head.appendChild(script);
    } catch (e) {
      console.error(e);
      statusEl.textContent = 'Error: ' + e.message;
    }
  })();
  </script>
</body>
</html>
