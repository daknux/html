function makeSyncThenable(value) {
    return {
        then: function (onFulfilled, onRejected) {
            try {
                var result = onFulfilled ? onFulfilled(value) : value;
                return Promise.resolve(result);
            } catch (e) {
                if (onRejected) {
                    try { return Promise.resolve(onRejected(e)); } catch (e2) { return Promise.reject(e2); }
                }
                return Promise.reject(e);
            }
        },
        catch: function () { return Promise.resolve(value); },
        finally: function (cb) { try { cb(); } catch (e) {} return Promise.resolve(value); }
    };
}

function installInstanceProxy() {
    myGameInstance = {
        SendMessage: function (go, fn, param) {
            if (_realInstance) {
                try { _realInstance.SendMessage(go, fn, param); } catch (e) { console.warn('[sm] ' + go + '.' + fn + ' failed:', e); }
            } else {

function hideLoader() {
    var el = document.getElementById('loader');
    if (!el) return;
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
}

function setStatus(t) { var el = document.getElementById('loaderStatus'); if (el) el.textContent = t; }
function setProgress(f) { var el = document.getElementById('loaderBar'); if (el) el.style.width = Math.max(0, Math.min(100, f * 100)) + '%'; }
function fmtMB(b) { return (b / 1048576).toFixed(1) + ' MB'; }

function startsWithAscii(bytes, str) {
    if (bytes.length < str.length) return false;
    for (var i = 0; i < str.length; i++) if (bytes[i] !== str.charCodeAt(i)) return false;
    return true;
}
function startsWithBytes(bytes, arr) {
    if (bytes.length < arr.length) return false;
    for (var i = 0; i < arr.length; i++) if (bytes[i] !== arr[i]) return false;
    return true;
}

function looksAlreadyDecompressed(bytes, filename) {
    if (!bytes || bytes.length < 4) return false;
    if (/\.data(\.br|\.unityweb)?$/i.test(filename)) {
        if (startsWithAscii(bytes, 'UnityWebData')) return true;
    }
    if (/\.wasm(\.br|\.unityweb)?$/i.test(filename)) {
        if (startsWithBytes(bytes, [0x00, 0x61, 0x73, 0x6D])) return true;
    }
    if (/\.(framework\.)?js(\.br|\.unityweb)?$/i.test(filename)) {
        var b0 = bytes[0], b1 = bytes[1];
        if (b0 === 0x2F && b1 === 0x2A) return true;
        if (b0 === 0x28) return true;
        if (b0 === 0x21) return true;
        if (b0 === 0x76 && b1 === 0x61) return true;
        if (b0 === 0x3B) return true;
        if (b0 === 0x0A || b0 === 0x0D) return true;
        if (startsWithAscii(bytes, 'var ') || startsWithAscii(bytes, 'const ') || startsWithAscii(bytes, 'let ')) return true;
        if (startsWithAscii(bytes, 'import ') || startsWithAscii(bytes, 'export ')) return true;
    }
    return false;
}

async function brDecompress(bytes) {
    if (typeof DecompressionStream !== 'undefined') {
        try {
            var ds = new DecompressionStream('br');
            var stream = new Blob([bytes]).stream().pipeThrough(ds);
            return new Uint8Array(await new Response(stream).arrayBuffer());
        } catch (e) {
            console.log('[br] DecompressionStream(br) unavailable: ' + e.message);
        }
    }
    var mod = await import('https://cdn.jsdelivr.net/npm/brotli-dec-wasm@2.3.2/+esm');
    var brotli = await mod.default;
    var stream = new brotli.DecompressStream();
    var out = [], offset = 0;
    for (var iter = 0; iter < 2000; iter++) {
        var res = stream.decompress(bytes.slice(offset), 1 << 20);
        if (res.buf && res.buf.length) out.push(res.buf);
        offset += res.input_offset || 0;
        if (res.code === 1) break;
        if (res.code === 2) { if (offset >= bytes.length) break; continue; }
        if (res.code === 3) continue;
        throw new Error('brotli code=' + res.code);
    }
    var total = 0;
    for (var i = 0; i < out.length; i++) total += out[i].length;
    var result = new Uint8Array(total);
    var pos = 0;
    for (var i = 0; i < out.length; i++) { result.set(out[i], pos); pos += out[i].length; }
    return result;
}

async function processCompressed(blob, name) {
    var arr = new Uint8Array(await blob.arrayBuffer());
    if (looksAlreadyDecompressed(arr, name)) {
        var hex = '';
        for (var i = 0; i < Math.min(16, arr.length); i++) hex += arr[i].toString(16).padStart(2, '0') + ' ';
        console.log('[compressed] already plain: ' + name + ' ' + hex.trim());
        return arr;
    }
    if (arr.length >= 2 && arr[0] === 0x1F && arr[1] === 0x8B && typeof DecompressionStream !== 'undefined') {
        try {
            var ds = new DecompressionStream('gzip');
            var stream = new Blob([arr]).stream().pipeThrough(ds);
            var dec = new Uint8Array(await new Response(stream).arrayBuffer());
            console.log('[gzip] decompressed ' + name + ' ' + arr.length + ' -> ' + dec.length);
            return dec;
        } catch (e) {
            console.warn('[gzip] failed for ' + name + ': ' + e.message);
        }
    }
    if (/\.br$/i.test(name)) {
        try {
            var dec2 = await brDecompress(arr);
            console.log('[br] decompressed ' + name + ' ' + arr.length + ' -> ' + dec2.length);
            return dec2;
        } catch (e) {
            console.warn('[br] decompress failed for ' + name + ': ' + e.message + ' — serving raw');
            return arr;
        }
    }
    return arr;
}

var MIME = {
    js: 'application/javascript', mjs: 'application/javascript', json: 'application/json',
    wasm: 'application/wasm', data: 'application/octet-stream', zip: 'application/zip',
    bin: 'application/octet-stream', bundle: 'application/octet-stream',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp',
    gif: 'image/gif', svg: 'image/svg+xml', ico: 'image/x-icon',
    mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav', opus: 'audio/opus',
    webm: 'video/webm', mp4: 'video/mp4',
    ttf: 'font/ttf', otf: 'font/otf', woff: 'font/woff', woff2: 'font/woff2',
    css: 'text/css', html: 'text/html', txt: 'text/plain', unityweb: 'application/octet-stream'
};
function mimeFor(n) {
    var d = n.lastIndexOf('.');
    return d < 0 ? 'application/octet-stream' : (MIME[n.substring(d + 1).toLowerCase()] || 'application/octet-stream');
}
function mimeForUnityweb(innerName) {
    if (/\.data$/i.test(innerName)) return 'application/octet-stream';
    if (/\.wasm$/i.test(innerName)) return 'application/wasm';
    if (/\.framework\.js$/i.test(innerName) || /\.js$/i.test(innerName)) return 'application/javascript';
    return 'application/octet-stream';
}

var fileMap = new Map();

function cleanPath(u) {
    if (!u) return '';
    var s = String(u).trim();
    if (s.startsWith('blob:')) s = s.substring(5);
    if (s.indexOf('://') !== -1) { try { s = new URL(s).pathname; } catch (e) {} }
    s = s.split('?')[0].split('#')[0];
    while (s.startsWith('../')) s = s.substring(3);
    while (s.startsWith('./')) s = s.substring(2);
    s = s.replace(/^\/+/, '');
    return s.toLowerCase();
}

function findFileBlob(target) {
    if (!target || typeof target !== 'string') return null;
    if (target.startsWith('data:')) return null;
    var clean = cleanPath(target);
    if (!clean) return null;
    if (fileMap.has(clean)) return fileMap.get(clean);
    var name = clean.split('/').pop();
    if (!name) return null;
    var it = fileMap.entries(), e;
    while (!(e = it.next()).done) {
        var k = e.value[0], b = e.value[1];
        if (k === name || k.endsWith('/' + name)) return b;
    }
    return null;
}

function findBuildFile(pattern) {
    var it = fileMap.entries(), e;
    while (!(e = it.next()).done) {
        var k = e.value[0], b = e.value[1];
        if (pattern.test(k)) return { path: k, blob: b };
    }
    return null;
}

async function injectBlobScript(text, overrideSrc) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
    await new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        if (overrideSrc) s.__overrideSrc = overrideSrc;
        s.src = url;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('Failed to inject script: ' + (overrideSrc || url))); };
        document.head.appendChild(s);
    });
}

(async function () {
    try {
        installYandexStub();
        installInstanceProxy();

        (async function () {
            try {
                var s = await window.YaGames.init();
                ysdk = s;
                window.ysdk = s;
                try { s.adv.showFullscreenAdv({ callbacks: {} }); } catch (e) {}
                var p = await s.getPlayer({ scopes: true });
                player = p;
                window.player = p;
                var l = await s.getLeaderboards();
                lb = l;
                window.lb = l;
                console.log('[sdk] ready');
            } catch (e) {
                console.warn('[sdk] init failed:', e);
            }
        })();

        setStatus('Downloading game…');
        var ZIP_URL = 'https://quizizz.com/_media/uploadedFiles/439fed97-8021-43b0-9fd6-0f9f9ae1eec2-v2';
        var resp = await fetch(ZIP_URL);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var total = parseInt(resp.headers.get('Content-Length') || '0', 10);
        var reader = resp.body.getReader();
        var chunks = [], received = 0;
        while (true) {
            var r = await reader.read();
            if (r.done) break;
            chunks.push(r.value);
            received += r.value.length;
            if (total > 0) {
                setProgress((received / total) * 0.35);
                document.getElementById('loaderMB').textContent = fmtMB(received) + ' / ' + fmtMB(total);
            } else {
                document.getElementById('loaderMB').textContent = fmtMB(received);
            }
        }
        var buf = new Uint8Array(received);
        var off = 0;
        for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].length; }
        chunks.length = 0;

        setStatus('Extracting…');
        var zip = await JSZip.loadAsync(buf.buffer);
        var names = Object.keys(zip.files);

        var prefix = '';
        var probe = names.find(function (n) { return /Build\/[^\/]+\.loader\.js$/i.test(n); });
        if (probe) {
            var m = probe.match(/^(.*\/)Build\/[^\/]+\.loader\.js$/i);
            if (m) prefix = m[1];
        }

        var entries = [];
        for (var n = 0; n < names.length; n++) {
            var nm = names[n];
            var ent = zip.files[nm];
            if (ent.dir) continue;
            var p = nm;
            if (prefix && p.indexOf(prefix) === 0) p = p.substring(prefix.length);
            p = p.replace(/^\/+/, '').toLowerCase();
            if (p) entries.push({ path: p, entry: ent });
        }

        var done = 0;
        for (var ei = 0; ei < entries.length; ei++) {
            var it = entries[ei];
            var b = await it.entry.async('blob');
            var typed;
            if (/\.(unityweb|br)$/i.test(it.path)) {
                setStatus('Processing ' + it.path.split('/').pop() + '…');
                var plainPath = it.path.replace(/\.(unityweb|br)$/i, '');
                var dec = await processCompressed(b, it.path);
                typed = new Blob([dec], { type: mimeForUnityweb(plainPath) });
                fileMap.set(plainPath, typed);
                fileMap.set(it.path, typed);
            } else {
                typed = new Blob([b], { type: mimeFor(it.path) });
                fileMap.set(it.path, typed);
            }
            done++;
            setProgress(0.35 + (done / entries.length) * 0.25);
            document.getElementById('loaderMB').textContent = done + ' / ' + entries.length + ' files';
        }

        var loaderEntry = findBuildFile(/build\/[^\/]+\.loader\.js$/i);
        var dataEntry = findBuildFile(/build\/[^\/]+\.data(\.unityweb|\.br)?$/i);
        var frameworkEntry = findBuildFile(/build\/[^\/]+\.framework\.js(\.unityweb|\.br)?$/i);
        var wasmEntry = findBuildFile(/build\/[^\/]+\.wasm(\.unityweb|\.br)?$/i);

        if (!loaderEntry || !dataEntry || !frameworkEntry || !wasmEntry) {
            console.log('[debug] fileMap keys:', Array.from(fileMap.keys()));
            throw new Error(
                'Missing build files in ZIP: ' +
                'loader=' + !!loaderEntry +
                ' data=' + !!dataEntry +
                ' framework=' + !!frameworkEntry +
                ' wasm=' + !!wasmEntry
            );
        }

        console.log('[extract] build files:');
        console.log('  loader:    ' + loaderEntry.path + ' (' + fmtMB(loaderEntry.blob.size) + ')');
        console.log('  data:      ' + dataEntry.path + ' (' + fmtMB(dataEntry.blob.size) + ')');
        console.log('  framework: ' + frameworkEntry.path + ' (' + fmtMB(frameworkEntry.blob.size) + ')');
        console.log('  wasm:      ' + wasmEntry.path + ' (' + fmtMB(wasmEntry.blob.size) + ')');

        try {
            var _fwBuf = await frameworkEntry.blob.arrayBuffer();
            var _fwText = new TextDecoder('utf-8', { fatal: false }).decode(_fwBuf);
            var variant = 'none';
            if (_fwText.indexOf('_onePixelGamesSDK') !== -1) variant = '1Pixel (_onePixelGamesSDK)';
            else if (_fwText.indexOf('YG2Instance') !== -1) variant = 'A (YG2Instance)';
            else if (_fwText.indexOf('YandexGame') !== -1) variant = 'B (YandexGame)';
            else if (_fwText.indexOf('_Yandex_') !== -1) variant = 'Poppy (_Yandex_*)';
            else if (_fwText.indexOf('Davilkus') !== -1) variant = 'Davilkus';
            console.log('[sdk] framework variant: ' + variant + ' (len=' + _fwText.length + ')');
        } catch (e) {
            console.warn('[sdk] variant detection failed:', e);
        }

        var bgBlob = fileMap.get('backgrounds/background_0.webp');
        if (bgBlob) {
            canvas.style.background = 'url(' + URL.createObjectURL(bgBlob) + ') center / cover';
        }

        var nativeFetch = window.fetch;
        window.fetch = async function (input, init) {
            var urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (urlStr && !urlStr.startsWith('blob:') && !urlStr.startsWith('data:')) {
                var blob = findFileBlob(urlStr);
                if (blob) {
                    return new Response(blob, {
                        status: 200,
                        headers: { 'Content-Type': blob.type || 'application/octet-stream', 'Content-Length': String(blob.size) }
                    });
                }
            }
            return nativeFetch.apply(this, arguments);
        };

        var nativeXhrOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
            if (typeof url === 'string' && !url.startsWith('blob:') && !url.startsWith('data:')) {
                var blob = findFileBlob(url);
                if (blob) {
                    var args = Array.prototype.slice.call(arguments);
                    args[1] = URL.createObjectURL(blob);
                    return nativeXhrOpen.apply(this, args);
                }
            }
            return nativeXhrOpen.apply(this, arguments);
        };

        var patchSrc = function (proto) {
            var d = Object.getOwnPropertyDescriptor(proto, 'src');
            if (!d || !d.set) return;
            Object.defineProperty(proto, 'src', {

        if (webaudioBlob) {

            console.log('[audio] WebAudio.js injected');
        } else {
            console.warn('[audio] WebAudio.js not found in ZIP');

        setStatus('Loading engine…');
        var loaderText = await loaderEntry.blob.text();
        if (loaderText.trimStart().startsWith('<')) {

        var dataUrl = URL.createObjectURL(dataEntry.blob);

        _realInstance = instance;
        window._realInstance = instance;

        while (_smQueue.length) {
            var item = _smQueue.shift();
            try { instance.SendMessage(item[0], item[1], item[2]); } catch (e) { console.warn('[sm-flush] failed:', e); }

        setStatus('Ready');

    } catch (err) {
        console.error(err);
        setStatus('Error: ' + (err && err.message ? err.message : String(err)));

document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
canvas.addEventListener('touchstart', function () { try { window.focus(); } catch (e) {} });
canvas.addEventListener('pointerdown', function () { try { window.focus(); } catch (e) {} });
