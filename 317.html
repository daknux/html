<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baldis Basic's in Wonky Physics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      display: none;
      z-index: 10;
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url("unity-logo-dark.png") no-repeat center / contain;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin: 10px auto 0;
      background: url("progress-bar-empty-dark.png") no-repeat center / contain;
    }

    #unity-progress-bar-full {
      width: 0;
      height: 18px;
      background: url("progress-bar-full-dark.png") no-repeat center / contain;
    }

    #unity-warning {
      position: absolute;
      top: 5%;
      left: 50%;
      display: none;
      z-index: 20;
      max-width: 90%;
      padding: 10px;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.innerHTML = message;

      if (type === "error") {
        div.style.cssText = "background:red;padding:10px;";
      } else if (type === "warning") {
        div.style.cssText = "background:yellow;padding:10px;";
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";

      if (type !== "error") {
        setTimeout(() => {
          div.remove();

          if (!warningBanner.children.length) {
            warningBanner.style.display = "none";
          }
        }, 5000);
      }
    }

    const config = {
      dataUrl:
        "https://media.blooket.com/raw/upload/cq5wium8zgw8jyctoeny.data",
      frameworkUrl:
        "https://media.blooket.com/raw/upload/j2mp9if64zplmxhcizmk.js",
      codeUrl:
        "https://media.blooket.com/raw/upload/uztqk9lmmw2o7qrgvysf.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ItzMaxwell",
      productName: "Baldis Basics In Wonky Physics",
      productVersion: "eh, who cares about the version -_-",
      showBanner: unityShowBanner
    };

    const script = document.createElement("script");

    script.src =
      "https://media.blooket.com/raw/upload/i4pykjwzgsf44brdht1n.js";

    loadingBar.style.display = "block";

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        progress => {
          progressBar.style.width = `${100 * progress}%`;
        }
      )
        .then(() => {
          loadingBar.style.display = "none";
        })
        .catch(message => {
          alert(message);
        });
    };

    script.onerror = () => {
      alert("Failed to load Unity loader script.");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
