<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ladi's Learning</title>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #231F20;
    }

    #unityContainer {
      position: fixed;
      inset: 0;
    }

    #unityContainer .logo,
    #unityContainer .progress {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #unityContainer .logo {
      width: 154px;
      height: 130px;
      background: url("https://media.blooket.com/raw/upload/mfrlfwnpw9ommmliacwv.png")
        no-repeat center / contain;
    }

    #unityContainer .progress {
      width: 141px;
      height: 18px;
      margin-top: 90px;
    }

    #unityContainer .progress .empty {
      float: right;
      width: 100%;
      height: 100%;
      background: url("https://media.blooket.com/raw/upload/nhr6fmwhxdvz1gx1sanp.png")
        no-repeat right / cover;
    }

    #unityContainer .progress .full {
      float: left;
      width: 0;
      height: 100%;
      background: url("https://media.blooket.com/raw/upload/pelqjd1scsflxywnjhsg.png")
        no-repeat left / cover;
    }
  </style>

  <script>
    function UnityProgress(unityInstance, progress) {
      if (!unityInstance.Module) return;

      if (!unityInstance.logo) {
        unityInstance.logo = document.createElement("div");
        unityInstance.logo.className =
          "logo " + unityInstance.Module.splashScreenStyle;

        unityInstance.container.appendChild(unityInstance.logo);
      }

      if (!unityInstance.progress) {
        unityInstance.progress = document.createElement("div");
        unityInstance.progress.className =
          "progress " + unityInstance.Module.splashScreenStyle;

        unityInstance.progress.empty = document.createElement("div");
        unityInstance.progress.empty.className = "empty";
        unityInstance.progress.appendChild(unityInstance.progress.empty);

        unityInstance.progress.full = document.createElement("div");
        unityInstance.progress.full.className = "full";
        unityInstance.progress.appendChild(unityInstance.progress.full);

        unityInstance.container.appendChild(unityInstance.progress);
      }

      unityInstance.progress.full.style.width = `${100 * progress}%`;
      unityInstance.progress.empty.style.width = `${100 * (1 - progress)}%`;

      if (progress === 1) {
        unityInstance.logo.style.display = "none";
        unityInstance.progress.style.display = "none";
      }
    }
  </script>
</head>

<body>
  <div id="unityContainer"></div>

  <script>
    const unityConfig = {
      companyName: "7gamex7.co",
      productName: "Maths",
      productVersion: "1.0",

      dataUrl:
        "https://media.blooket.com/raw/upload/sgevrsmy63f9oijevutv.unityweb",
      wasmCodeUrl:
        "https://media.blooket.com/raw/upload/akg7lnxvcnv1aszhlcaq.unityweb",
      wasmFrameworkUrl:
        "https://media.blooket.com/raw/upload/x3wqpwcwbbzmewv3zr3w.unityweb",

      graphicsAPI: [
        "WebGL 2.0",
        "WebGL 1.0"
      ],

      webglContextAttributes: {
        preserveDrawingBuffer: false
      },

      splashScreenStyle: "Dark",
      backgroundColor: "#231F20",

      developmentBuild: false,
      multithreading: false,
      unityVersion: "2019.4.31f1"
    };

    const jsonURL = URL.createObjectURL(
      new Blob([JSON.stringify(unityConfig)], {
        type: "application/json"
      })
    );

    fetch("https://media.blooket.com/raw/upload/xj16lmdhcgrpjynqcbky.js-svg")
      .then(response => {
        if (!response.ok) {
          throw new Error(response.status);
        }

        return response.text();
      })
      .then(source => {
        const matches = [...source.matchAll(/<svg\b[^>]*>/gi)];

        const start =
          matches.length >= 2
            ? matches[1].index + matches[1][0].length
            : matches.length === 1
              ? matches[0].index + matches[0][0].length
              : 0;

        const script = document.createElement("script");
        script.textContent = source.substring(start);
        document.body.appendChild(script);

        UnityLoader.instantiate("unityContainer", jsonURL, {
          onProgress: UnityProgress
        });
      })
      .catch(error => {
        console.error("JS-SVG loader error:", error);
        alert(error);
      });
  </script>
</body>
</html>
