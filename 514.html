<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
        rel="shortcut icon"
        href="https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/TemplateData/favicon.ico"
    />

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@895d0224580381ddd003fc2ab72afead3cf134ad/john.css"
    />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            background: transparent;
        }

        #unity-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-warning"></div>
    </div>

    <script>
        YaGames.init().then((ysdk) => {
            console.log("Yandex SDK initialized");
            window.ysdk = ysdk;
            initPlayer();
        });

        var player;

        function initPlayer() {
            return ysdk.getPlayer({ scopes: false }).then((_player) => {
                player = _player;
                return player;
            });
        }
    </script>

    <script>
        var canvas = document.querySelector("#unity-canvas");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length
                    ? "block"
                    : "none";
            }

            var div = document.createElement("div");
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === "error") {
                div.style = "background: red; padding: 10px;";
            } else if (type === "warning") {
                div.style = "background: yellow; padding: 10px;";

                setTimeout(function () {
                    if (warningBanner.contains(div)) {
                        warningBanner.removeChild(div);
                    }

                    updateBannerVisibility();
                }, 5000);
            }

            updateBannerVisibility();
        }

        let environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: "desktop",
            isMobile: false,
            isDesktop: true,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang: navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform: navigator.platform,

            browser: (function () {
                let userAgent = navigator.userAgent;

                if (userAgent.includes("YaBrowser")) return "Yandex";
                if (
                    userAgent.includes("OPR") ||
                    userAgent.includes("Opera")
                ) {
                    return "Opera";
                }
                if (userAgent.includes("Firefox")) return "Firefox";
                if (
                    userAgent.includes("MSIE") ||
                    userAgent.includes("Trident")
                ) {
                    return "IE";
                }
                if (userAgent.includes("Edge")) return "Edge";
                if (userAgent.includes("Chrome")) return "Chrome";
                if (userAgent.includes("Safari")) return "Safari";

                return "Other";
            })()
        };

        async function mergeFiles(parts) {
            const blobs = await Promise.all(
                parts.map(async (part) => {
                    const response = await fetch(part);

                    if (!response.ok) {
                        throw new Error(
                            `Failed to load ${part}: ${response.status}`
                        );
                    }

                    return response.blob();
                })
            );

            return URL.createObjectURL(new Blob(blobs));
        }

        async function initializeGame() {
            const buildUrl =
                "https://cdn.jsdelivr.net/gh/forms-docs-slides-glgl/ngng@main/Build";

            const loaderUrl = buildUrl + "/Granny 2.loader.js";

            const dataParts = [
                buildUrl + "/Granny 2_part1.data",
                buildUrl + "/Granny 2_part2.data",
                buildUrl + "/Granny 2_part3.data"
            ];

            const wasmParts = [
                buildUrl + "/Granny 2_part1.wasm",
                buildUrl + "/Granny 2_part2.wasm"
            ];

            const dataUrl = await mergeFiles(dataParts);
            const wasmUrl = await mergeFiles(wasmParts);

            const config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/Granny 2.frameworkx.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Awesome",
                productName: "Granny 2",
                productVersion: "1.0",
                showBanner: unityShowBanner
            };

            const script = document.createElement("script");
            script.src = loaderUrl;

            script.onload = () => {
                createUnityInstance(canvas, config)
                    .then((unityInstance) => {
                        window.myGameInstance = unityInstance;
                    })
                    .catch((error) => {
                        console.error(
                            "Failed to initialize game:",
                            error
                        );
                    });
            };

            script.onerror = () => {
                console.error(
                    "Failed to load Unity loader:",
                    loaderUrl
                );
            };

            document.body.appendChild(script);
        }

        initializeGame().catch((error) => {
            console.error("Failed to load game files:", error);
        });
    </script>
</body>
</html>
