<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecasted Restoration</title>
<style>
  html, body {
    width: 100%; height: 100%; margin: 0;
    overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
    overscroll-behavior: none; touch-action: none;
  }
  #canvas { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; }
  #spinner { display: none; }
  #loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #e8e8f0; gap: 14px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .5s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }
  #loading-screen .title { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  #loading-screen .status { font-size: 13px; color: #99a; min-height: 18px; text-align: center; padding: 0 20px; }
  #loading-screen .bar-wrap { width: min(420px, 80vw); height: 8px; background: #0a1a2a; border-radius: 4px; overflow: hidden; }
  #loading-screen .bar { height: 100%; width: 0%; background: #09f; transition: width .15s ease; }
  #loading-screen .mb { font-size: 12px; color: #778; font-variant-numeric: tabular-nums; }
  #loading-screen .credit { position: absolute; bottom: 16px; font-size: 12px; color: #778; letter-spacing: .5px; }
  #loading-screen .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #0a1a2a; border-top-color: #09f; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="loading-screen">
  <div class="spin"></div>
  <div class="title">Forecasted Restoration</div>
  <div class="status" id="status">Preparing…</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="mb" id="mb"></div>
  <div class="credit">Web Port by RalseiRals</div>
</div>
<canvas id="canvas"></canvas>
<div id="spinner" class="pending"></div>
<script>
(async function () {
  'use strict';

  const ZIP_URL = 'https://quizizz.com/_media/uploadedFiles/fc2f2164-3d1d-403f-b3d6-e39a24d160ca-v2';
  const GAME_FILE = 'forecasted.love';
  const LOGICAL_WIDTH = 640;
  const LOGICAL_HEIGHT = 480;

  const statusEl = document.getElementById('status');
  const barEl = document.getElementById('bar');
  const mbEl = document.getElementById('mb');
  const screenEl = document.getElementById('loading-screen');
  const canvasEl = document.getElementById('canvas');

  const setStatus = (t) => { statusEl.textContent = t; };
  const setProgress = (f) => { barEl.style.width = Math.max(0, Math.min(100, f * 100)) + '%'; };
  const fmtMB = (b) => (b / 1048576).toFixed(1) + ' MB';

  function resizeCanvas() {
    if (!canvasEl) return;
    const vw = window.innerWidth || document.documentElement.clientWidth;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const fit = Math.min(vw / LOGICAL_WIDTH, vh / LOGICAL_HEIGHT);
    canvasEl.style.width = Math.max(1, Math.floor(LOGICAL_WIDTH * fit)) + 'px';
    canvasEl.style.height = Math.max(1, Math.floor(LOGICAL_HEIGHT * fit)) + 'px';
  }
  window.addEventListener('resize', resizeCanvas, { passive: true });
  window.addEventListener('orientationchange', resizeCanvas, { passive: true });
  resizeCanvas();

  const MIME = {
    js: 'application/javascript', css: 'text/css', json: 'application/json',
    lua: 'text/plain', txt: 'text/plain', md: 'text/plain',
    wasm: 'application/wasm', love: 'application/octet-stream'
  };
  const mimeFor = (name) => {
    const ext = (name.split('.').pop() || '').toLowerCase();
    return MIME[ext] || 'application/octet-stream';
  };

  const fileMap = new Map();

  function findFileBlob(target) {
    if (!target || typeof target !== 'string' || target.startsWith('data:')) return null;
    const clean = target.replace(/^blob:/, '')
                        .replace(window.location.origin, '')
                        .replace(/^https?:\/\/[^\/]+/, '')
                        .split('?')[0]
                        .replace(/^\.\//, '')
                        .replace(/^\//, '')
                        .toLowerCase();
    if (fileMap.has(clean)) return fileMap.get(clean);
    for (const [key, blob] of fileMap.entries()) {
      if (key.endsWith('/' + clean) || clean.endsWith('/' + key)) return blob;
    }
    const filename = clean.split('/').pop();
    if (!filename) return null;
    for (const [key, blob] of fileMap.entries()) {
      if (key === filename || key.endsWith('/' + filename)) return blob;
    }
    return null;
  }

  function crc32(bytes) {
    const table = crc32.table || (crc32.table = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })());
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildLocalHeader(nameBytes, dataBytes, crc) {
    const buf = new Uint8Array(30 + nameBytes.length + dataBytes.length);
    const v = new DataView(buf.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0, true);
    v.setUint16(8, 0, true); v.setUint16(10, 0, true); v.setUint16(12, 0x21, true);
    v.setUint32(14, crc, true); v.setUint32(18, dataBytes.length, true); v.setUint32(22, dataBytes.length, true);
    v.setUint16(26, nameBytes.length, true); v.setUint16(28, 0, true);
    buf.set(nameBytes, 30); buf.set(dataBytes, 30 + nameBytes.length);
    return buf;
  }

  function buildCdEntry(nameBytes, dataBytes, crc, localOffset) {
    const buf = new Uint8Array(46 + nameBytes.length);
    const v = new DataView(buf.buffer);
    v.setUint32(0, 0x02014b50, true); v.setUint16(4, 20, true); v.setUint16(6, 20, true);
    v.setUint16(8, 0, true); v.setUint16(10, 0, true); v.setUint16(12, 0, true);
    v.setUint16(14, 0x21, true); v.setUint32(16, crc, true);
    v.setUint32(20, dataBytes.length, true); v.setUint32(24, dataBytes.length, true);
    v.setUint16(28, nameBytes.length, true); v.setUint16(30, 0, true); v.setUint16(32, 0, true);
    v.setUint16(34, 0, true); v.setUint16(36, 0, true); v.setUint32(38, 0, true); v.setUint32(42, localOffset, true);
    buf.set(nameBytes, 46);
    return buf;
  }

  function buildEocd(entryCount, cdSize, cdOffset) {
    const buf = new Uint8Array(22);
    const v = new DataView(buf.buffer);
    v.setUint32(0, 0x06054b50, true); v.setUint16(4, 0, true); v.setUint16(6, 0, true);
    v.setUint16(8, entryCount, true); v.setUint16(10, entryCount, true);
    v.setUint32(12, cdSize, true); v.setUint32(16, cdOffset, true); v.setUint16(20, 0, true);
    return buf;
  }

  async function readEocd(blob) {
    const tailSize = Math.min(65557, blob.size);
    const tailBuf = await blob.slice(blob.size - tailSize).arrayBuffer();
    const tailView = new DataView(tailBuf);
    const tailBytes = new Uint8Array(tailBuf);
    for (let i = tailBytes.length - 22; i >= 0; i--) {
      if (tailView.getUint32(i, true) === 0x06054b50) {
        return { cdSize: tailView.getUint32(i + 12, true), cdOffset: tailView.getUint32(i + 16, true), entryCount: tailView.getUint16(i + 10, true) };
      }
    }
    throw new Error('EOCD not found');
  }

  async function appendFileToZipBlob(blob, filename, content) {
    const { cdSize, cdOffset, entryCount } = await readEocd(blob);
    const enc = new TextEncoder();
    const nameBytes = enc.encode(filename);
    const dataBytes = typeof content === 'string' ? enc.encode(content) : content;
    const crc = crc32(dataBytes);
    const local = buildLocalHeader(nameBytes, dataBytes, crc);
    const cdEntry = buildCdEntry(nameBytes, dataBytes, crc, cdOffset);
    const eocd = buildEocd(entryCount + 1, cdSize + cdEntry.length, cdOffset + local.length);
    return new Blob([blob.slice(0, cdOffset), local, blob.slice(cdOffset, cdOffset + cdSize), cdEntry, eocd]);
  }

  async function replaceMultipleInZip(blob, patches) {
    if (patches.size === 0) return blob;
    const { cdSize, cdOffset, entryCount } = await readEocd(blob);
    const cdBuf = await blob.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
    const cdBytes = new Uint8Array(cdBuf);
    const cdView = new DataView(cdBuf);
    const dec = new TextDecoder();
    const enc = new TextEncoder();
    const keptEntries = [];
    let appliedCount = 0;
    let pos = 0;
    while (pos < cdBuf.byteLength) {
      if (cdView.getUint32(pos, true) !== 0x02014b50) break;
      const nameLen = cdView.getUint16(pos + 28, true);
      const extraLen = cdView.getUint16(pos + 30, true);
      const commentLen = cdView.getUint16(pos + 32, true);
      const entryLen = 46 + nameLen + extraLen + commentLen;
      const name = dec.decode(cdBytes.slice(pos + 46, pos + 46 + nameLen));
      if (!patches.has(name)) keptEntries.push(cdBytes.slice(pos, pos + entryLen));
      else appliedCount++;
      pos += entryLen;
    }
    const newLocals = [];
    const newCdEntries = [];
    let localOffset = cdOffset;
    for (const [name, content] of patches) {
      const contentBytes = typeof content === 'string' ? enc.encode(content) : content;
      const nameBytes = enc.encode(name);
      const crc = crc32(contentBytes);
      const local = buildLocalHeader(nameBytes, contentBytes, crc);
      const cdEntry = buildCdEntry(nameBytes, contentBytes, crc, localOffset);
      newLocals.push(local);
      newCdEntries.push(cdEntry);
      localOffset += local.length;
    }
    let cdTotal = 0;
    for (const p of keptEntries) cdTotal += p.length;
    for (const p of newCdEntries) cdTotal += p.length;
    const newCd = new Uint8Array(cdTotal);
    let off = 0;
    for (const p of keptEntries) { newCd.set(p, off); off += p.length; }
    for (const p of newCdEntries) { newCd.set(p, off); off += p.length; }
    const newEntryCount = entryCount - appliedCount + newCdEntries.length;
    const eocd = buildEocd(newEntryCount, newCd.length, localOffset);
    const parts = [blob.slice(0, cdOffset)];
    for (const l of newLocals) parts.push(l);
    parts.push(newCd);
    parts.push(eocd);
    return new Blob(parts);
  }

  async function extractFileFromLove(loveBlob, name, info) {
    const lhBuf = await loveBlob.slice(info.localOffset, info.localOffset + 30).arrayBuffer();
    const lhView = new DataView(lhBuf);
    if (lhView.getUint32(0, true) !== 0x04034b50) return null;
    const dataOffset = info.localOffset + 30 + lhView.getUint16(26, true) + lhView.getUint16(28, true);
    const compressedBuf = await loveBlob.slice(dataOffset, dataOffset + info.compressedSize).arrayBuffer();
    if (info.method === 0) return new TextDecoder().decode(compressedBuf);
    if (info.method === 8) {
      if (typeof DecompressionStream === 'undefined') return null;
      const stream = new Blob([compressedBuf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new TextDecoder().decode(await new Response(stream).arrayBuffer());
    }
    return null;
  }

  async function extractBytesFromLove(loveBlob, info) {
    const lhBuf = await loveBlob.slice(info.localOffset, info.localOffset + 30).arrayBuffer();
    const lhView = new DataView(lhBuf);
    if (lhView.getUint32(0, true) !== 0x04034b50) return null;
    const dataOffset = info.localOffset + 30 + lhView.getUint16(26, true) + lhView.getUint16(28, true);
    const compressedBuf = await loveBlob.slice(dataOffset, dataOffset + info.compressedSize).arrayBuffer();
    if (info.method === 0) return new Uint8Array(compressedBuf);
    if (info.method === 8) {
      if (typeof DecompressionStream === 'undefined') return null;
      const stream = new Blob([compressedBuf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return null;
  }

  async function findEntryInfo(loveBlob, targetName) {
    const { cdSize, cdOffset } = await readEocd(loveBlob);
    const cdBuf = await loveBlob.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
    const cdBytes = new Uint8Array(cdBuf);
    const cdView = new DataView(cdBuf);
    const dec = new TextDecoder();
    let pos = 0;
    while (pos < cdBuf.byteLength) {
      if (cdView.getUint32(pos, true) !== 0x02014b50) break;
      const nameLen = cdView.getUint16(pos + 28, true);
      const extraLen = cdView.getUint16(pos + 30, true);
      const commentLen = cdView.getUint16(pos + 32, true);
      const name = dec.decode(cdBytes.slice(pos + 46, pos + 46 + nameLen));
      if (name === targetName) {
        return {
          method: cdView.getUint16(pos + 10, true),
          compressedSize: cdView.getUint32(pos + 20, true),
          uncompressedSize: cdView.getUint32(pos + 24, true),
          localOffset: cdView.getUint32(pos + 42, true)
        };
      }
      pos += 46 + nameLen + extraLen + commentLen;
    }
    return null;
  }

  async function getAllEntries(loveBlob) {
    const { cdSize, cdOffset } = await readEocd(loveBlob);
    const cdBuf = await loveBlob.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
    const cdBytes = new Uint8Array(cdBuf);
    const cdView = new DataView(cdBuf);
    const dec = new TextDecoder();
    const entries = new Map();
    let pos = 0;
    while (pos < cdBuf.byteLength) {
      if (cdView.getUint32(pos, true) !== 0x02014b50) break;
      const method = cdView.getUint16(pos + 10, true);
      const compSize = cdView.getUint32(pos + 20, true);
      const uncompSize = cdView.getUint32(pos + 24, true);
      const nameLen = cdView.getUint16(pos + 28, true);
      const extraLen = cdView.getUint16(pos + 30, true);
      const commentLen = cdView.getUint16(pos + 32, true);
      const localOff = cdView.getUint32(pos + 42, true);
      const name = dec.decode(cdBytes.slice(pos + 46, pos + 46 + nameLen));
      entries.set(name, { method, compressedSize: compSize, uncompressedSize: uncompSize, localOffset: localOff });
      pos += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  function stripLuaNoise(src) {
    return src.replace(/--\[(=*)\[[\s\S]*?\]\1\]/g, '').replace(/--[^\n]*/g, '')
              .replace(/\[(=*)\[[\s\S]*?\]\1\]/g, '')
              .replace(/"(?:\\.|[^"\\])*"/g, '""').replace(/'(?:\\.|[^'\\])*'/g, "''");
  }

  function isBalancedLuaSnippet(snippet) {
    const clean = stripLuaNoise(snippet);
    return (clean.match(/\b(?:function|if|do|repeat)\b/g) || []).length === (clean.match(/\b(?:end|until)\b/g) || []).length;
  }

  function transformGotoContinue(source) {
    let result = source.replace(/\r\n/g, '\n');
    let searchFrom = 0, iterations = 0, handled = 0;
    while (iterations++ < 500) {
      const rest = result.slice(searchFrom);
      const gotoMatch = /\bgoto\s+continue\b/.exec(rest);
      if (!gotoMatch) break;
      const gotoPos = searchFrom + gotoMatch.index;
      const gotoEnd = gotoPos + gotoMatch[0].length;
      const beforeGoto = result.slice(0, gotoPos);
      const ifRe = /\bif\b/g;
      const ifPositions = [];
      let m;
      while ((m = ifRe.exec(beforeGoto)) !== null) ifPositions.push(m.index);
      let ifPos = -1, thenPos = -1;
      for (let k = ifPositions.length - 1; k >= 0; k--) {
        const cand = ifPositions[k];
        const tIdx = result.indexOf('then', cand);
        if (tIdx < 0 || tIdx >= gotoPos) continue;
        if (!/^\s*$/.test(result.slice(tIdx + 4, gotoPos))) continue;
        ifPos = cand; thenPos = tIdx; break;
      }
      if (ifPos < 0) { searchFrom = gotoEnd; continue; }
      const afterGoto = result.slice(gotoEnd);
      const endMatch = /^\s*end\b/.exec(afterGoto);
      if (!endMatch) { searchFrom = gotoEnd; continue; }
      const ifEndPos = gotoEnd + endMatch[0].length;
      const labelIdx = result.indexOf('::continue::', ifEndPos);
      if (labelIdx < 0) { searchFrom = gotoEnd; continue; }
      const condition = result.slice(ifPos + 2, thenPos).trim();
      const body = result.slice(ifEndPos, labelIdx);
      if (/\bgoto\s+continue\b/.test(body)) { searchFrom = gotoEnd; continue; }
      if (!isBalancedLuaSnippet(body)) { searchFrom = gotoEnd; continue; }
      const baseIndent = result.slice(ifPos).match(/^[ \t]*/)[0];
      const bodyIndented = body.replace(/\s+$/, '').split('\n').map(line => line.trim() ? '    ' + line : line).join('\n');
      result = result.slice(0, ifPos) + `if not (${condition}) then\n${bodyIndented}\n${baseIndent}end` + result.slice(labelIdx + '::continue::'.length);
      handled++;
      searchFrom = 0;
    }
    return { result, handled, leftover: /\bgoto\s+continue\b/.test(result) };
  }

  function patchDebugSystemText(src) {
    src = src.replace(/\r\n/g, '\n');
    if (!/\bgoto\s+continue\b/.test(src)) return null;
    const re = /(if i == 0 then\s*\n[ \t]+table\.insert\(assign_randomly, wave\)\s*\n)[ \t]+goto continue\s*\n([ \t]+)end\s*\n([\s\S]*?)\n([ \t]+)end\s*\n([ \t]+)end\s*\n([ \t]+)::continue::/;
    if (!re.test(src)) return null;
    return src.replace(re, (m, prefix, innerIndent, middle, midEndIndent, outerEndIndent) =>
      prefix + innerIndent + 'else\n' + middle + '\n' + midEndIndent + 'end\n' + innerIndent + 'end\n' + outerEndIndent + 'end'
    );
  }

  function promoteNestedLongStrings(src) {
    const n = src.length;
    const out = [];
    let i = 0;
    let lastCopy = 0;
    let changed = false;
    while (i < n) {
      const c = src[i];
      if (c === '-' && i + 1 < n && src[i + 1] === '-') {
        if (i + 2 < n && src[i + 2] === '[') {
          const m = /^\[(=*)\[/.exec(src.slice(i + 2));
          if (m) {
            const level = m[1].length;
            const close = ']' + '='.repeat(level) + ']';
            const openLen = 1 + level + 1;
            let j = i + 2 + openLen;
            while (j < n && !src.startsWith(close, j)) j++;
            if (j < n) { i = j + close.length; continue; }
          }
        }
        let j = i + 2;
        while (j < n && src[j] !== '\n') j++;
        i = j;
        continue;
      }
      if (c === '"' || c === "'") {
        const quote = c;
        let j = i + 1;
        while (j < n) {
          if (src[j] === '\\') { j += 2; continue; }
          if (src[j] === quote || src[j] === '\n') { j++; break; }
          j++;
        }
        i = j;
        continue;
      }
      if (c === '[') {
        const m = /^\[(=*)\[/.exec(src.slice(i));
        if (m) {
          const level = m[1].length;
          const close = ']' + '='.repeat(level) + ']';
          const openLen = 1 + level + 1;
          let j = i + openLen;
          while (j < n && !src.startsWith(close, j)) j++;
          if (j < n) {
            const content = src.slice(i + openLen, j);
            if (content.includes('[[')) {
              let newLevel = level + 1;
              while (newLevel < 30) {
                const newClose = ']' + '='.repeat(newLevel) + ']';
                const newOpen = '[' + '='.repeat(newLevel) + '[';
                if (!content.includes(newClose) && !content.includes(newOpen)) break;
                newLevel++;
              }
              if (lastCopy < i) out.push(src.slice(lastCopy, i));
              out.push('[' + '='.repeat(newLevel) + '[' + content + ']' + '='.repeat(newLevel) + ']');
              lastCopy = j + close.length;
              changed = true;
            }
            i = j + close.length;
            continue;
          }
        }
      }
      i++;
    }
    if (!changed) return { result: src, changed: false };
    if (lastCopy < n) out.push(src.slice(lastCopy));
    return { result: out.join(''), changed: true };
  }

  async function scanAndPatchLua(loveBlob) {
    const { cdSize, cdOffset } = await readEocd(loveBlob);
    const cdBuf = await loveBlob.slice(cdOffset, cdOffset + cdSize).arrayBuffer();
    const cdBytes = new Uint8Array(cdBuf);
    const cdView = new DataView(cdBuf);
    const dec = new TextDecoder();
    const entries = new Map();
    let pos = 0;
    while (pos < cdBuf.byteLength) {
      if (cdView.getUint32(pos, true) !== 0x02014b50) break;
      const method = cdView.getUint16(pos + 10, true);
      const compSize = cdView.getUint32(pos + 20, true);
      const nameLen = cdView.getUint16(pos + 28, true);
      const extraLen = cdView.getUint16(pos + 30, true);
      const commentLen = cdView.getUint16(pos + 32, true);
      const localOff = cdView.getUint32(pos + 42, true);
      const name = dec.decode(cdBytes.slice(pos + 46, pos + 46 + nameLen));
      entries.set(name, { method, compressedSize: compSize, localOffset: localOff });
      pos += 46 + nameLen + extraLen + commentLen;
    }
    const luaNames = [...entries.keys()].filter(n => n.endsWith('.lua') && entries.get(n).compressedSize > 200);
    const patches = new Map();
    const skipped = [];
    for (let i = 0; i < luaNames.length; i++) {
      const name = luaNames[i];
      try {
        const text = await extractFileFromLove(loveBlob, name, entries.get(name));
        if (!text) continue;
        const hasGoto = /\bgoto\s+continue\b/.test(text);
        const hasLongStr = text.includes('[[');
        if (!hasGoto && !hasLongStr) continue;
        let current = text;
        let changed = false;
        if (hasGoto) {
          const { result, handled, leftover } = transformGotoContinue(current);
          if (handled > 0 && !leftover) {
            current = result;
            changed = true;
          } else if (leftover) {
            skipped.push({ name, handled, leftover, text: current });
            continue;
          }
        }
        if (hasLongStr) {
          const { result, changed: lsChanged } = promoteNestedLongStrings(current);
          if (lsChanged) { current = result; changed = true; }
        }
        if (changed) patches.set(name, current);
      } catch (e) {}
      if (i % 50 === 0) setStatus('Scanning Lua… ' + (i + 1) + '/' + luaNames.length);
    }
    return { patches, skipped };
  }

  const MAIN_SHIM = `
TARGET_MOD = "drfc-in-too-deep-restored"
AUTO_MOD_START = true

if not bit then
    bit = (function()
        local b = {}
        local floor = math.floor
        local function norm(x)
            x = x % 4294967296
            if x < 0 then x = x + 4294967296 end
            return x
        end
        local function signed(x)
            x = norm(x)
            if x >= 2147483648 then return x - 4294967296 end
            return x
        end
        b.tobit = signed
        local band_nib, bor_nib, bxor_nib = {}, {}, {}
        for i = 0, 15 do

    __loader_thread_shimmed = true

    local function _pump_all()

            local t = _threads[i]
            if t and t._pump then t:_pump() end
        end
    end
    local function _mkch(name)
        if name and _channels[name] then return _channels[name] end
        local buf = {}
        local ch = { _name = name }
        function ch:push(v) table.insert(buf, v); _pump_all() end
        function ch:supply(v) self:push(v) end
        function ch:pop() return table.remove(buf, 1) end
        function ch:demand()
            while #buf == 0 do
                local co = coroutine.running()
                if co then coroutine.yield() else return nil end
            end
            return table.remove(buf, 1)
        end
        function ch:peek() return buf[1] end
        function ch:getCount() return #buf end
        function ch:clear() for i = #buf, 1, -1 do buf[i] = nil end end
        function ch:performAtomic() end
        if name then _channels[name] = ch end
        return ch
    end
    local function _mkthr(source)
        local t = {}
        local co
        local chunk
        local _error
        if type(source) == "string" then
            local ok, loaded = pcall(love.filesystem.load, source)
            if ok then chunk = loaded else _error = loaded end
        elseif type(source) == "function" then chunk = source
        else _error = "unsupported source type: " .. type(source) end
        function t:_pump()
            if not co or coroutine.status(co) ~= "suspended" then return end
            local ok, err = coroutine.resume(co)
            if not ok then
                print("[loader] SYNC THREAD ERROR: " .. tostring(err))
                _error = err
            end
        end
        function t:start(...)
            if _error or not chunk then return end
            co = coroutine.create(chunk)
            table.insert(_threads, t)
            t:_pump()
        end
        function t:wait()
            while co and coroutine.status(co) ~= "dead" do
                t:_pump()
                if not co or coroutine.status(co) == "dead" then break end
                if coroutine.running() then coroutine.yield() end
                if not co then break end
            end
        end
        function t:isRunning() return co ~= nil and coroutine.status(co) ~= "dead" end
        function t:getError() return _error end
        return t
    end
    love.thread.newThread = function(source) return _mkthr(source) end
    love.thread.newChannel = function(name) return _mkch(name) end

        local n = tonumber(expr)
        if n then return n end
        local vn, vargs = expr:match("^vec([234])%s*%((.-)%)$")

        if (csText && !csText.includes('__loader_cutscene_fallback')) {
          let newText = csText;

          const re1 = /else\s*if type\(id\)\s*==\s*"string"\s*then\s*error\("No cutscene found: "\s*\.\.\s*cutscene\s*\.\.\s*"\."\s*\.\.\s*id\)\s*else\s*error\("No cutscene found: "\s*\.\.\s*cutscene\)\s*end\s*end/;
          const rep1 = 'else print("[loader] WARNING: missing cutscene: " .. tostring(cutscene) .. "." .. tostring(id)) -- __loader_cutscene_fallback\n                    self.id = tostring(cutscene) .. "." .. tostring(id)\n                    return function() end, {}\n                end';

          const re2 = /else\s*error\("No cutscene found: "\s*\.\.\s*cutscene\)\s*end/g;
          const rep2 = 'else print("[loader] WARNING: missing cutscene: " .. tostring(cutscene)) -- __loader_cutscene_fallback\n                self.id = tostring(cutscene)\n                return function() end, {}\n            end';

          if (re1.test(newText)) {
            newText = newText.replace(re1, rep1);
            console.log('[loader] cutscene.lua: id-case fallback patched');
          }
          if (re2.test(newText)) {
            newText = newText.replace(re2, rep2);
            console.log('[loader] cutscene.lua: dotted-case fallback patched');
          }

          const resumeRe = /local ok, msg = coroutine\.resume\(self\.coroutine, \.\.\.\)\s*if not ok then\s*COROUTINE_TRACEBACK = debug\.traceback\(self\.coroutine\)\s*error\(msg\)\s*end/;
          const resumeRep = `local ok, msg = coroutine.resume(self.coroutine, ...)
    if not ok then
        print("[loader] cutscene runtime error swallowed: " .. tostring(msg))
        self.ended = true
        self:onEnd()
    end -- __loader_cutscene_fallback`;

          if (resumeRe.test(newText)) {
            newText = newText.replace(resumeRe, resumeRep);
            console.log('[loader] cutscene.lua: resume error swallow patched');
          }

          if (newText !== csText && newText.includes('__loader_cutscene_fallback')) {
            patched = await replaceMultipleInZip(patched, new Map([[csPath, newText]]));
            console.log('[loader] cutscene.lua patched successfully');
          } else {
            console.warn('[loader] cutscene.lua patch failed — content not changed');
          }
        }
      } else {
        console.warn('[loader] cutscene.lua not found at expected path');
      }
    } catch (e) { console.error('[loader] cutscene patch error:', e); }

    try {
      const mainInfo = await findEntryInfo(patched, 'main.lua');
      if (mainInfo) {
        const mainText = await extractFileFromLove(patched, 'main.lua', mainInfo);
        if (mainText && !mainText.includes('__loader_thread_shimmed')) {
          patched = await replaceMultipleInZip(patched, new Map([['main.lua', MAIN_SHIM + '\n\n' + mainText]]));
        }
      }
    } catch (e) {}

    try {
      setStatus('Replacing unsafe fonts…');
      const mainTtfInfo = await findEntryInfo(patched, 'assets/fonts/main.ttf');
      if (mainTtfInfo) {
        const mainTtfBytes = await extractBytesFromLove(patched, mainTtfInfo);
        if (mainTtfBytes && mainTtfBytes.length > 200) {
          const allEntries = await getAllEntries(patched);
          const fontPatches = new Map();
          for (const [name, info] of allEntries.entries()) {
            if (!name.endsWith('.ttf') || !name.includes('/fonts/')) continue;
            if (name === 'assets/fonts/main.ttf') continue;
            const size = info.uncompressedSize || info.compressedSize;
            const basename = name.split('/').pop();
            const isCJK = /(^|\/)ja[_\-]?/i.test(name) || /cjk|noto[-_]?cjk|han|kanji/i.test(basename);
            if (isCJK || size > 1024 * 1024) fontPatches.set(name, mainTtfBytes);
          }
          if (fontPatches.size > 0) patched = await replaceMultipleInZip(patched, fontPatches);
        }
      }
    } catch (e) {}

    try {
      setStatus('Patching shaders…');
      const shaderEntries = await getAllEntries(patched);
      const shaderPatches = new Map();
      for (const [name, info] of shaderEntries.entries()) {
        if (!/\.(frag|vert|glsl|shader)$/i.test(name)) continue;
        const text = await extractFileFromLove(patched, name, info);
        if (!text) continue;
        let changed = false;
        let newText = text.replace(/(extern\s+)int(\s+)/g, (m, p, s) => { changed = true; return p + 'float' + s; });
        newText = newText.replace(/(uniform\s+)int(\s+)/g, (m, p, s) => { changed = true; return p + 'float' + s; });
        newText = newText.replace(/(extern\s+\w+\s+)(\w+)(\s*=\s*)([^;]+)(\s*;)/g, (m, p, n, eq, expr, s) => {
          changed = true;
          return p + n + s;
        });
        newText = newText.replace(/(uniform\s+\w+\s+)(\w+)(\s*=\s*)([^;]+)(\s*;)/g, (m, p, n, eq, expr, s) => {
          changed = true;
          return p + n + s;
        });
        if (changed) shaderPatches.set(name, newText);
      }
      if (shaderPatches.size > 0) {
        patched = await replaceMultipleInZip(patched, shaderPatches);
      }
    } catch (e) {}

    fileMap.set(GAME_FILE.toLowerCase(), patched);
  }

  try {
    const normBlob = findFileBlob('lua/normalize1.lua');
    if (normBlob) {
      let normText = await normBlob.text();
      if (!normText.includes('[LOADER] newFileData compat')) {
        normText += `

-- [LOADER] newFileData compat + FileData→path tracking
__loader_fd_paths = __loader_fd_paths or {}
do
    if type(_lfs_newFile) == "function" then
        local __orig_lfs = _lfs_newFile
        _lfs_newFile = function(fn, arg, ...)
            if fn == nil then return nil end
            if arg == nil and type(fn) == "string" then
                local contents = love.filesystem.read(fn)
                if contents then
                    local fd = __orig_lfs(contents, fn)
                    if fd and type(fd) == "userdata" then __loader_fd_paths[fd] = fn end
                    return fd
                end
                return nil, "newFile: not found: " .. fn
            end
            return __orig_lfs(fn, arg, ...)
        end
    end
    local __orig_nfd = love.filesystem.newFileData
    if type(__orig_nfd) == "function" then
        love.filesystem.newFileData = function(a, b, ...)
            if a == nil then return nil, "newFileData: nil first arg" end
            if b == nil and type(a) == "string" then
                local contents = love.filesystem.read(a)
                if contents then
                    local fd = __orig_nfd(contents, a)
                    if fd and type(fd) == "userdata" then __loader_fd_paths[fd] = a end
                    return fd
                end
                return nil, "newFileData: not found: " .. a
            end
            return __orig_nfd(a, b, ...)
        end
    end
end
`;
        fileMap.set('lua/normalize1.lua', new Blob([normText], { type: 'text/plain' }));
      }
    }
  } catch (e) {}

  const cssBlob = findFileBlob('style.css');
  if (cssBlob) {
    let css = await cssBlob.text();
    css = css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/gi, (m, q, u) => {
      if (u.startsWith('data:') || u.startsWith('blob:') || /^https?:\/\//i.test(u)) return m;
      const b = findFileBlob(u);
      return b ? 'url("' + URL.createObjectURL(b) + '")' : m;
    });
    const st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
  }

  const originalFetch = window.fetch;
  window.fetch = async function (input, init) {
    const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
    const blob = findFileBlob(urlStr);
    if (blob) {
      return new Response(blob, {
        status: 200,
        headers: { 'Content-Type': blob.type || 'application/octet-stream', 'Content-Length': blob.size.toString() }
      });
    }
    return originalFetch(input, init);
  };

  const originalXHROpen = window.XMLHttpRequest.prototype.open;
  window.XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    if (typeof url === 'string') {
      const blob = findFileBlob(url);
      if (blob) url = URL.createObjectURL(blob);
    }
    return originalXHROpen.call(this, method, url, ...rest);
  };

  const NativeWorker = window.Worker;
  window.Worker = function (url, options) {
    const urlStr = (url && typeof url.href === 'string') ? url.href : String(url);
    if (urlStr && !urlStr.startsWith('blob:')) {
      const blob = findFileBlob(urlStr);
      if (blob) url = URL.createObjectURL(new Blob([blob], { type: 'application/javascript' }));
    }
    return new NativeWorker(url, options);
  };
  window.Worker.prototype = NativeWorker.prototype;

  const scriptSrcDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
  Object.defineProperty(HTMLScriptElement.prototype, 'src', {
    get() { return this.__overrideSrc || scriptSrcDesc.get.call(this); },
    set(v) {
      const blob = findFileBlob(v);
      if (blob) { scriptSrcDesc.set.call(this, URL.createObjectURL(blob)); return; }
      scriptSrcDesc.set.call(this, v);
    },
    configurable: true
  });

  const origSetAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (name, value) {
    if (name && name.toLowerCase() === 'src' && typeof value === 'string') {
      const blob = findFileBlob(value);
      if (blob) value = URL.createObjectURL(blob);
    }
    return origSetAttr.call(this, name, value);
  };

  for (const Ctor of [HTMLImageElement, HTMLMediaElement, HTMLSourceElement]) {
    if (!Ctor) continue;
    const desc = Object.getOwnPropertyDescriptor(Ctor.prototype, 'src');
    if (!desc || !desc.set) continue;
    Object.defineProperty(Ctor.prototype, 'src', {
      get() { return desc.get.call(this); },
      set(v) {
        const blob = findFileBlob(v);
        if (blob) { desc.set.call(this, URL.createObjectURL(blob)); return; }
        desc.set.call(this, v);
      },
      configurable: true
    });
  }

  setStatus('Starting…');
  mbEl.textContent = '';
  const playerBlob = findFileBlob('player.js');
  if (!playerBlob) throw new Error('player.js not found in archive');
  const playerText = await playerBlob.text();
  const playerUrl = URL.createObjectURL(new Blob([playerText], { type: 'application/javascript' }));
  const s = document.createElement('script');
  s.__overrideSrc = 'https://love.local/player.js?v=11.5&n=1&g=' + encodeURIComponent(GAME_FILE);
  scriptSrcDesc.set.call(s, playerUrl);
  document.body.appendChild(s);

  let hidden = false;
  const hideScreen = () => {
    if (hidden) return;
    hidden = true;
    screenEl.classList.add('hidden');
    setTimeout(() => screenEl.remove(), 600);
  };
  const checkCanvas = () => {
    resizeCanvas();
    const c = document.querySelector('canvas');
    if (c && (c.width > 300 || c.height > 150)) hideScreen();
  };
  new MutationObserver(checkCanvas).observe(document.body, { attributes: true, childList: true, subtree: true });
  checkCanvas();
  setTimeout(hideScreen, 4000);
})().catch(err => {
  const el = document.getElementById('status');
  if (el) el.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
  console.error(err);
});
</script>
</body>
</html>
