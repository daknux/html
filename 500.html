<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Type"
      content="text/html; charset=utf-8"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>pneumonoultramicroscopicsilicovolcanoconiosis</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a0a;
        color: #fff;
        font-family: "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      #loading {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 0.5s;
      }

      #progress-container {
        width: 250px;
        height: 2px;
        background: #222;
        margin-top: 20px;
        overflow: hidden;
      }

      #progress-bar {
        width: 0%;
        height: 100%;
        background: #fff;
        transition: width 0.2s;
      }

      #loading-text {
        font-size: 0.8rem;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <div id="loading">
      <div id="loading-text">initializing 0%</div>
      <div id="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>

    <script>
      const BASE =
        "https://cdn.jsdelivr.net/gh/Reeyuki/Pneumo@main/";

      const ASSETS = {
        "Build/,.data": 2,
        "Build/,.wasm": 2,
        "Build/,.framework.js": 1,
        "Build/,.loader.js": 1,
      };

      const canvas = document.querySelector("#canvas");
      const loading = document.querySelector("#loading");
      const loadingText = document.querySelector("#loading-text");
      const progressBar = document.querySelector("#progress-bar");

      let unityInst = null;

      async function fetchAsset(path, count) {
        const chunks = [];

        for (let i = 0; i < count; i++) {
          const url =
            BASE +
            path +
            (count > 1 ? i.toString().padStart(2, "0") : "");

          chunks.push(
            fetch(url).then((r) => {
              if (!r.ok) {
                throw new Error("Load failed: " + url);
              }

              return r.arrayBuffer();
            })
          );
        }

        const parts = await Promise.all(chunks);

        const type = path.endsWith(".js")
          ? "application/javascript"
          : "application/octet-stream";

        return new Blob(parts, { type });
      }

      async function start() {
        try {
          const keys = Object.keys(ASSETS);
          const total = keys.length;
          let loadedCount = 0;
          const results = {};

          const update = (p) => {
            const pct = Math.round(p * 100);
            loadingText.textContent = `loading ${pct}%`;
            progressBar.style.width = `${pct}%`;
          };

          await Promise.all(
            keys.map(async (key) => {
              results[key] = await fetchAsset(key, ASSETS[key]);
              loadedCount++;
              update((loadedCount / total) * 0.4);
            })
          );

          const config = {
            dataUrl: URL.createObjectURL(
              results["Build/,.data"]
            ),
            frameworkUrl: URL.createObjectURL(
              results["Build/,.framework.js"]
            ),
            codeUrl: URL.createObjectURL(
              results["Build/,.wasm"]
            ),
            streamingAssetsUrl: BASE + "StreamingAssets",
            companyName: "SadColoredStudios",
            productName:
              "pneumonoultramicroscopicsilicovolcanoconiosis",
            productVersion: "2.0.0",
          };

          const script = document.createElement("script");
          script.src = URL.createObjectURL(
            results["Build/,.loader.js"]
          );

          script.onload = async () => {
            try {
              unityInst = await createUnityInstance(
                canvas,
                config,
                (p) => {
                  update(0.4 + p * 0.6);
                }
              );

              loading.style.opacity = "0";

              setTimeout(() => {
                loading.style.display = "none";
              }, 500);
            } catch (error) {
              console.error("Unity initialization failed:", error);
              loadingText.textContent = "Failed to load";
            }
          };

          script.onerror = () => {
            loadingText.textContent = "Failed to load engine";
            console.error("Failed to load Unity loader.");
          };

          document.body.appendChild(script);
        } catch (error) {
          console.error("Asset loading failed:", error);
          loadingText.textContent = "Failed to load";
        }
      }

      start();
    </script>
  </body>
</html>
