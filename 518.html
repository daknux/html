<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Baldi Basics: Ps1 Edition</title>
	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		body {
			color: white;
			background-color: black;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
		}

		#canvas:focus {
			outline: none;
		}

		#status, #status-splash, #status-progress {
			position: absolute;
			left: 0;
			right: 0;
		}

		#status, #status-splash {
			top: 0;
			bottom: 0;
		}

		#status {
			background-color: #000000;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			visibility: hidden;
		}

		#status-splash {
			max-height: 100%;
			max-width: 100%;
			margin: auto;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-splash.fullsize--true {
			height: 100%;
			width: 100%;
			object-fit: contain;
		}

		#status-splash.use-filter--false {
			image-rendering: pixelated;
		}

		#status-progress, #status-notice {
			display: none;
		}

		#status-progress {
			bottom: 10%;
			width: 50%;
			margin: 0 auto;
		}

		#status-notice {
			background-color: #5b3943;
			border-radius: 0.5rem;
			border: 1px solid #9b3943;
			color: #e0e0e0;
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			line-height: 1.3;
			margin: 0 2rem;
			overflow: hidden;
			padding: 1rem;
			text-align: center;
			z-index: 1;
		}

		#mouse-lock-warning {
			position: fixed;
			left: 50%;
			top: 20px;
			transform: translateX(-50%);
			z-index: 20;
			padding: 12px 20px;
			border-radius: 6px;
			background: #ffeb3b;
			color: #000000;
			font-family: Arial, sans-serif;
			font-size: 16px;
			font-weight: 500;
			text-align: center;
			white-space: nowrap;
			pointer-events: none;
			user-select: none;
			opacity: 0;
			transition: opacity 0.25s ease;
		}

		#mouse-lock-warning.visible {
			opacity: 1;
		}

		#mouse-lock-warning strong {
			font-weight: 700;
		}
	</style>
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="https://quizizz.com/_media/uploads/da653285-dd0a-42e2-998f-98adc094894f-v2" alt="">
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
	</div>

	<div id="mouse-lock-warning">Press <strong>Z</strong> to lock mouse</div>

	<script src="https://quizizz.com/_media/uploads/8ba3079f-949b-4249-88f9-61bd31d30e84-v2"></script>
	<script>
		const PACK_URL = "https://quizizz.com/_media/uploads/49ca1677-b95b-4ee2-b0cc-00bf4b2d5a8a-v2";
		const WASM_URL = "https://quizizz.com/_media/uploads/5da111ae-94b2-4f4f-8e64-d34084fccdca-v2";
		const AUDIO_WORKLET_URL = "https://quizizz.com/_media/uploads/60ffad0e-1c9d-4050-8691-a6102382c133-v2";
		const AUDIO_POSITION_WORKLET_URL = "https://quizizz.com/_media/uploads/67fbfab0-1359-4eca-8b5a-30d62f2e0487-v2";

		const originalFetch = window.fetch.bind(window);

		const fileMap = {
			"index.pck": PACK_URL,
			"index.wasm": WASM_URL
		};

		window.fetch = function (resource, init) {
			const url = resource instanceof Request ? resource.url : String(resource);
			const file = Object.keys(fileMap).find(name => url.endsWith(name));
			if (!file) {
				return originalFetch(resource, init);
			}
			const replacement = fileMap[file];
			return originalFetch(
				resource instanceof Request ? new Request(replacement, resource) : replacement,
				init
			);
		};

		if (window.AudioWorklet && AudioWorklet.prototype.addModule) {
			const originalAddModule = AudioWorklet.prototype.addModule;

			const workletMap = {
				"index.audio.worklet.js": AUDIO_WORKLET_URL,
				"godot.audio.worklet.js": AUDIO_WORKLET_URL,
				"index.audio.position.worklet.js": AUDIO_POSITION_WORKLET_URL,
				"godot.audio.position.worklet.js": AUDIO_POSITION_WORKLET_URL
			};

			AudioWorklet.prototype.addModule = async function (moduleURL, options) {
				const url = typeof moduleURL === "string"
					? moduleURL
					: (moduleURL.href || String(moduleURL));

				const file = Object.keys(workletMap).find(name => url.endsWith(name));
				if (!file) {
					return originalAddModule.call(this, moduleURL, options);
				}

				const replacement = workletMap[file];

				const response = await originalFetch(replacement, { cache: "no-store" });
				if (!response.ok) {
					throw new Error(
						"Could not load AudioWorklet: " + response.status + " " + response.statusText
					);
				}

				const source = await response.text();
				const blobURL = URL.createObjectURL(
					new Blob([source], { type: "application/javascript" })
				);

				try {
					return await originalAddModule.call(this, blobURL, options);
				} finally {
					setTimeout(() => URL.revokeObjectURL(blobURL), 30000);
				}
			};
		}

		const gameCanvas = document.getElementById("canvas");
		const mouseLockWarning = document.getElementById("mouse-lock-warning");

		let warningTimer;

		function showMouseLockWarning() {
			clearTimeout(warningTimer);
			mouseLockWarning.classList.add("visible");

			warningTimer = setTimeout(function () {
				mouseLockWarning.classList.remove("visible");
			}, 5000);
		}

		function lockMouse() {
			if (!document.pointerLockElement) {
				if (gameCanvas.requestPointerLock) {
					gameCanvas.requestPointerLock();
				}
			}
		}

		function unlockMouse() {
			if (document.pointerLockElement) {
				document.exitPointerLock();
			}
		}

		function toggleMouseLock() {
			if (document.pointerLockElement) {
				unlockMouse();
			} else {
				lockMouse();
			}
		}

		document.addEventListener("keydown", function (event) {
			if (event.key.toLowerCase() === "z") {
				event.preventDefault();
				toggleMouseLock();
			}
		});

		window.addEventListener("pointerlockchange", function () {
			if (!document.pointerLockElement) {
				showMouseLockWarning();
			}
		});

		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"emscriptenPoolSize": 8,
			"ensureCrossOriginIsolationHeaders": true,
			"executable": "index",
			"experimentalVK": false,
			"fileSizes": {
				"index.pck": 29483212,
				"index.wasm": 37685705
			},
			"focusCanvas": true,
			"gdextensionLibs": [],
			"godotPoolSize": 4
		};

		const GODOT_THREADS_ENABLED = false;

		if (typeof Engine === "undefined") {
			console.error("The Godot engine loader failed to load.");
		} else {
			const engine = new Engine(GODOT_CONFIG);

			(function () {
				const statusOverlay = document.getElementById('status');
				const statusProgress = document.getElementById('status-progress');
				const statusNotice = document.getElementById('status-notice');

				let initializing = true;
				let statusMode = '';

				function setStatusMode(mode) {
					if (statusMode === mode || !initializing) {
						return;
					}
					if (mode === 'hidden') {
						statusOverlay.remove();
						initializing = false;
						return;
					}
					statusOverlay.style.visibility = 'visible';
					statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
					statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
					statusMode = mode;
				}

				function setStatusNotice(text) {
					while (statusNotice.lastChild) {
						statusNotice.removeChild(statusNotice.lastChild);
					}
					const lines = text.split('\n');
					lines.forEach((line) => {
						statusNotice.appendChild(document.createTextNode(line));
						statusNotice.appendChild(document.createElement('br'));
					});
				}

				function displayFailureNotice(err) {
					console.error(err);
					if (err instanceof Error) {
						setStatusNotice(err.message);
					} else if (typeof err === 'string') {
						setStatusNotice(err);
					} else {
						setStatusNotice('An unknown error occurred.');
					}
					setStatusMode('notice');
					initializing = false;
				}

				const missing = Engine.getMissingFeatures({
					threads: GODOT_THREADS_ENABLED,
				});

				if (missing.length !== 0) {
					if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
						let serviceWorkerRegistrationPromise;
						try {
							serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
						} catch (err) {
							serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
						}
						Promise.race([
							serviceWorkerRegistrationPromise.then((registration) => {
								if (registration != null) {
									return Promise.reject(new Error('Service worker already exists.'));
								}
								return registration;
							}).then(() => engine.installServiceWorker()),
							new Promise((resolve) => {
								setTimeout(() => resolve(), 2000);
							}),
						]).then(() => {
							window.location.reload();
						}).catch((err) => {
							console.error('Error while registering service worker:', err);
						});
					} else {
						const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
						displayFailureNotice(missingMsg + missing.join('\n'));
					}
				} else {
					setStatusMode('progress');
					engine.startGame({
						'onProgress': function (current, total) {
							if (current > 0 && total > 0) {
								statusProgress.value = current;
								statusProgress.max = total;
							} else {
								statusProgress.removeAttribute('value');
								statusProgress.removeAttribute('max');
							}
						},
					}).then(() => {
						setStatusMode('hidden');
						showMouseLockWarning();
					}, displayFailureNotice);
				}
			}());
		}
	</script>
</body>
</html>
