<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Pink Tic Tac Toe</title>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    ruffle-player {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "visible",
      letterbox: "fullscreen",
      backgroundColor: "#000000",
      warnOnUnsupportedContent: true,
      contextMenu: "on",
      showSwfDownload: false,
      upgradeToHttps: true,
      logLevel: "error"
    };

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";

        document.getElementById("game").appendChild(player);

        await player.ruffle().load({
          url: "https://quizizz.com/_media/uploadedFiles/b2be73a3-efd3-468d-870e-e046a57bd6b6-v2",
          autoplay: "on",
          letterbox: "fullscreen",
          backgroundColor: "#000000",
          upgradeToHttps: true
        });

      } catch (error) {
        console.error("Ruffle loading error:", error);
        document.getElementById("game").innerHTML =
          '<div style="color:white;padding:20px;font-family:Arial">' +
          'Unable to load the Flash game. Check the SWF URL and network permissions.' +
          '</div>';
      }
    });
  </script>
</body>
</html>
