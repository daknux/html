<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover"
    />
    <title>Antidisestablishmentarianism</title>
    <link
      rel="icon"
      href="https://cdn.jsdelivr.net/gh/reeyuki/yukios@main/favicon.ico"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #unity-wrap,
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #unity-wrap {
        overflow: hidden;
      }

      #unity-canvas {
        display: block;
        outline: none;
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      #loading-card {
        display: grid;
        gap: 10px;
        width: min(420px, 90%);
        padding: 20px;
        color: #ddd;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        font: 14px system-ui, sans-serif;
      }

      #loading-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #loading-header .label {
        color: #bbb;
      }

      #pct {
        color: #888;
        font-variant-numeric: tabular-nums;
      }

      #status {
        color: #888;
        font-size: 12px;
      }

      #bar {
        height: 4px;
        overflow: hidden;
        background: #222;
        border-radius: 2px;
      }

      #bar-fill {
        width: 0;
        height: 100%;
        background: #777;
        transition: width 120ms linear;
      }

      @media (prefers-reduced-motion: reduce) {
        #bar-fill {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="unity-wrap">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="overlay">
        <div id="loading-card">
          <div id="loading-header">
            <span class="label">Loading</span>
            <span id="pct">0%</span>
          </div>
          <div id="bar">
            <div id="bar-fill"></div>
          </div>
          <div id="status">Preparing…</div>
        </div>
      </div>
    </div>

    <script>
      const cdnBase =
        "https://cdn.jsdelivr.net/gh/reeyuki/yukios-games@main/Antidisestablishmentarianism/";
      const buildUrl = cdnBase + "Build";
      const loaderUrl = buildUrl + "/antidis.loader.js";

      const canvas = document.querySelector("#unity-canvas");
      const overlay = document.querySelector("#overlay");
      const statusEl = document.querySelector("#status");
      const pctEl = document.querySelector("#pct");
      const barFill = document.querySelector("#bar-fill");

      function setProgress(progress) {
        const percent = Math.round(
          Math.max(0, Math.min(1, progress)) * 100
        );
        barFill.style.width = percent + "%";
        pctEl.textContent = percent + "%";
      }

      function formatBytes(bytes) {
        const units = ["B", "KB", "MB", "GB"];
        let unit = 0;

        while (bytes >= 1024 && unit < units.length - 1) {
          bytes /= 1024;
          unit++;
        }

        return `${bytes.toFixed(unit ? 1 : 0)} ${units[unit]}`;
      }

      async function fetchSplitToObjectUrl({
        urlPrefix,
        partCount,
        mimeType,
        onProgress,
      }) {
        const chunks = [];
        let downloaded = 0;
        let expectedTotal = 0;

        for (let i = 0; i < partCount; i++) {
          const url = `${urlPrefix}.${String(i).padStart(2, "0")}`;
          const response = await fetch(url, {
            cache: "force-cache",
          });

          if (!response.ok) {
            throw new Error(
              `Failed to fetch ${url}: ${response.status} ${response.statusText}`
            );
          }

          expectedTotal += Number(
            response.headers.get("content-length") || 0
          );

          const chunk = await response.arrayBuffer();
          downloaded += chunk.byteLength;
          chunks.push(chunk);

          onProgress?.({ downloaded, expectedTotal });
        }

        return URL.createObjectURL(
          new Blob(chunks, { type: mimeType })
        );
      }

      const config = {
        dataUrl: "",
        frameworkUrl: buildUrl + "/antidis.framework.js",
        codeUrl: "",
        streamingAssetsUrl: buildUrl + "/StreamingAssets",
        companyName: "antidisestablishmentanarisanism",
        productName: "antidisestablishmentanarisanism",
        productVersion: "antidisestablishmentanarisanism",
      };

      async function startGame() {
        try {
          statusEl.textContent = "Downloading…";
          setProgress(0.01);

          const sizeHints = {
            data: 33088400,
            wasm: 17932481,
          };

          const downloaded = { data: 0, wasm: 0 };
          const expected = { data: 0, wasm: 0 };

          function refreshProgress() {
            const totalDownloaded =
              downloaded.data + downloaded.wasm;
            const totalExpected =
              (expected.data || sizeHints.data) +
              (expected.wasm || sizeHints.wasm);

            statusEl.textContent =
              `${formatBytes(totalDownloaded)} / ` +
              formatBytes(totalExpected);

            setProgress(
              totalExpected
                ? Math.min(
                    0.75,
                    (totalDownloaded / totalExpected) * 0.75
                  )
                : 0.02
            );
          }

          const [dataUrl, wasmUrl] = await Promise.all([
            fetchSplitToObjectUrl({
              urlPrefix: buildUrl + "/antidis.data",
              partCount: 4,
              mimeType: "application/octet-stream",
              onProgress: ({ downloaded: bytes, expectedTotal }) => {
                downloaded.data = bytes;
                expected.data = expectedTotal;
                refreshProgress();
              },
            }),
            fetchSplitToObjectUrl({
              urlPrefix: buildUrl + "/antidis.wasm",
              partCount: 2,
              mimeType: "application/wasm",
              onProgress: ({ downloaded: bytes, expectedTotal }) => {
                downloaded.wasm = bytes;
                expected.wasm = expectedTotal;
                refreshProgress();
              },
            }),
          ]);

          config.dataUrl = dataUrl;
          config.codeUrl = wasmUrl;

          statusEl.textContent = "Starting engine…";
          setProgress(0.78);

          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = loaderUrl;
            script.async = true;
            script.onload = resolve;
            script.onerror = () =>
              reject(new Error(`Failed to load ${loaderUrl}`));

            document.body.appendChild(script);
          });

          await createUnityInstance(canvas, config, (progress) => {
            setProgress(0.78 + Math.max(0, Math.min(1, progress)) * 0.22);
            statusEl.textContent = "Initializing…";
          });

          overlay.style.display = "none";

          URL.revokeObjectURL(dataUrl);
          URL.revokeObjectURL(wasmUrl);
        } catch (error) {
          console.error(error);
          statusEl.textContent = "Failed to start. Check console for details.";
          setProgress(1);
        }
      }

      startGame();
    </script>
  </body>
</html>
