<!DOCTYPE html>

<html lang="en-us">
<base href="https://cdn.jsdelivr.net/gh/Timmers437283/random-rips@55a734164d5f0fe11d707088e192cd6a67236879/super-pickleball-adventure/">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Super Pickleball Adventure</title>
  <style>
    html,
    body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    div.gm4html5_div_class {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    :-webkit-full-screen #canvas {
      width: 100%;
      height: 100%;
    }

    :-webkit-full-screen {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <canvas id="canvas" width="800" height="640">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>

  <script src="scripts/inline_script_1.js"></script>
  <script src="scripts/inline_script_2.js"></script>
</body>

</html>
