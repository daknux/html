<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baldi's Basics in Education and Learning Development Build Recreation</title>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      background: url("https://media.blooket.com/raw/upload/uimw84htl65o8k1hpizn.jpg")
        center / cover;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas"></canvas>

  <script>
    async function loadJsSvg(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(response.status);
      }

      const source = await response.text();
      const matches = [...source.matchAll(/<svg\b[^>]*>/gi)];

      const start =
        matches.length >= 2
          ? matches[1].index + matches[1][0].length
          : matches.length === 1
            ? matches[0].index + matches[0][0].length
            : 0;

      return source.substring(start);
    }

    Promise.all([
      loadJsSvg(
        "https://media.blooket.com/raw/upload/ezkxofqfyxii5xbprppg.js-svg"
      ),
      loadJsSvg(
        "https://media.blooket.com/raw/upload/qnkhjf7b4rzgwxjgukvc.js-svg"
      )
    ])
      .then(([loaderSource, frameworkSource]) => {
        const frameworkUrl = URL.createObjectURL(
          new Blob([frameworkSource], {
            type: "application/javascript"
          })
        );

        const script = document.createElement("script");
        script.textContent = loaderSource;
        document.body.appendChild(script);

        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl:
            "https://media.blooket.com/raw/upload/gyfavnn67qe5zq0cgo48.data",
          frameworkUrl: frameworkUrl,
          codeUrl:
            "https://media.blooket.com/raw/upload/ihmlm5nffhxzqmzevdqn.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "JohnsterSpaceGames",
          productName: "Baldi's Basics in Education and Learning Development Build",
          productVersion: "1.01",
          matchWebGLToCanvasSize: true
        });
      })
      .catch(error => {
        console.error("JS-SVG loader error:", error);
      });
  </script>
</body>
</html>
