<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baldis Basic's in Wonky Physics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      display: none;
      z-index: 10;
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url("https://media.blooket.com/raw/upload/zsvtifp11njzlloxqyuj.png") no-repeat center / contain;
    }

    #unity-progress-bar-empty {
      position: relative;
      width: 141px;
      height: 18px;
      margin: 10px auto 0;
      background: url("https://media.blooket.com/raw/upload/rgbq0ncrr4sttnrhz2gv.png") no-repeat center / contain;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 18px;
      background: url("https://media.blooket.com/raw/upload/bhkcuzv1fiagwk8sfxve.png") no-repeat left center / auto 18px;
    }

    #unity-warning {
      position: absolute;
      top: 5%;
      left: 50%;
      display: none;
      z-index: 20;
      max-width: 90%;
      padding: 10px;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      text-align: center;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.textContent = message;

      if (type === "error") {
        div.style.cssText = "background:red;padding:10px;";
      } else if (type === "warning") {
        div.style.cssText = "background:yellow;padding:10px;";
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";

      if (type !== "error") {
        setTimeout(() => {
          div.remove();

          if (!warningBanner.children.length) {
            warningBanner.style.display = "none";
          }
        }, 5000);
      }
    }

    async function getJsSvgSource(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `Failed to fetch ${url}: HTTP ${response.status}`
        );
      }

      let source = await response.text();

      const svgMatches = [...source.matchAll(/<svg\b[^>]*>/gi)];

      if (svgMatches.length >= 2) {
        source = source.slice(
          svgMatches[1].index + svgMatches[1][0].length
        );
      } else if (svgMatches.length === 1) {
        source = source.slice(
          svgMatches[0].index + svgMatches[0][0].length
        );
      }

      return source;
    }

    async function getJsSvgBlobUrl(url) {
      const source = await getJsSvgSource(url);

      return URL.createObjectURL(
        new Blob([source], {
          type: "application/javascript"
        })
      );
    }

    async function loadJsSvgScript(url) {
      const source = await getJsSvgSource(url);
      const script = document.createElement("script");

      script.textContent = source;
      document.body.appendChild(script);
    }

    const config = {
      dataUrl:
        "https://media.blooket.com/raw/upload/cq5wium8zgw8jyctoeny.data",
      frameworkUrl: null,
      codeUrl:
        "https://media.blooket.com/raw/upload/uztqk9lmmw2o7qrgvysf.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ItzMaxwell",
      productName: "Baldis Basics In Wonky Physics",
      productVersion: "eh, who cares about the version -_-",
      showBanner: unityShowBanner
    };

    loadingBar.style.display = "block";

    (async () => {
      try {
        config.frameworkUrl = await getJsSvgBlobUrl(
          "https://media.blooket.com/raw/upload/n22uh1d80kfbmgosojun.js-svg"
        );

        await loadJsSvgScript(
          "https://media.blooket.com/raw/upload/hi6ppmct7pxxsyrevc7z.js-svg"
        );

        createUnityInstance(
          canvas,
          config,
          progress => {
            progressBar.style.width = `${100 * progress}%`;
          }
        )
          .then(() => {
            loadingBar.style.display = "none";
          })
          .catch(error => {
            console.error(error);
            unityShowBanner(error, "error");
          });
      } catch (error) {
        console.error(error);
        loadingBar.style.display = "none";
        unityShowBanner(error, "error");
      }
    })();
  </script>
</body>
</html>
