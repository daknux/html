var fileMap = new Map();

function cleanPath(u){
  if(!u) return '';
  var s = String(u).trim();
  if(s.startsWith('blob:')) s = s.substring(5);
  if(s.indexOf('://') !== -1){ try { s = new URL(s).pathname; } catch(e){} }
  s = s.split('?')[0].split('#')[0];
  while(s.startsWith('../')) s = s.substring(3);
  while(s.startsWith('./')) s = s.substring(2);
  s = s.replace(/^\/+/,'');
  return s.toLowerCase();
}

function findFileBlob(target){
  if(!target || typeof target !== 'string') return null;
  if(target.startsWith('data:')) return null;
  var clean = cleanPath(target);
  if(!clean) return null;
  if(fileMap.has(clean)) return fileMap.get(clean);
  var name = clean.split('/').pop();
  if(!name) return null;
  var it = fileMap.entries(), e;
  while(!(e = it.next()).done){
    var k = e.value[0], b = e.value[1];
    if(k === name || k.endsWith('/' + name)) return b;
  }
  return null;
}

function findBuildFile(pattern){
  var it = fileMap.entries(), e;
  while(!(e = it.next()).done){
    var k = e.value[0], b = e.value[1];
    if(pattern.test(k)) return { path: k, blob: b };
  }
  return null;
}

function mimeFor(n){
  var d = n.lastIndexOf('.');
  if(d < 0) return 'application/octet-stream';
  var ext = n.substring(d+1).toLowerCase();
  var M = {
    js:'application/javascript', mjs:'application/javascript', json:'application/json',
    wasm:'application/wasm', data:'application/octet-stream', zip:'application/zip',
    bin:'application/octet-stream', bundle:'application/octet-stream',
    png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp',
    gif:'image/gif', svg:'image/svg+xml', ico:'image/x-icon',
    mp3:'audio/mpeg', ogg:'audio/ogg', wav:'audio/wav', opus:'audio/opus',
    webm:'video/webm', mp4:'video/mp4',
    ttf:'font/ttf', otf:'font/otf', woff:'font/woff', woff2:'font/woff2',
    css:'text/css', html:'text/html', txt:'text/plain',
    unityweb:'application/octet-stream'
  };
  return M[ext] || 'application/octet-stream';
}

function mimeForUnityweb(innerName){
  if(/\.data$/i.test(innerName)) return 'application/octet-stream';
  if(/\.wasm$/i.test(innerName)) return 'application/wasm';
  if(/\.framework\.js$/i.test(innerName) || /\.js$/i.test(innerName)) return 'application/javascript';
  return 'application/octet-stream';
}

async function processUnityweb(blob){
  var arr = new Uint8Array(await blob.arrayBuffer());
  if(arr.length >= 2 && arr[0] === 0x1F && arr[1] === 0x8B && typeof DecompressionStream !== 'undefined'){
    try {
      var ds = new DecompressionStream('gzip');
      var stream = new Blob([arr]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    } catch(e){}
  }
  return arr;
}

async function injectBlobScript(text, overrideSrc){

    if(overrideSrc) s.__overrideSrc = overrideSrc;
    s.src = url;
    s.onload = resolve;
    s.onerror = function(){ reject(new Error('Script injection failed')); };
    document.head.appendChild(s);
  });
}

    console.warn('[css-url] unmatched: ' + p);
    return m;

function sweepEl(el){
  if(!el || el.nodeType !== 1) return;
  var tag = el.tagName;
  if(tag === 'IMG' || tag === 'SOURCE'){
    var s = el.getAttribute('src');
    if(s && !s.startsWith('blob:') && !s.startsWith('data:')){
      var bl = findFileBlob(s);

    var ss = el.getAttribute('srcset');
    if(ss && ss.indexOf('blob:') === -1){
      var parts = ss.split(',').map(function(part){
        var t = part.trim(); var sp = t.indexOf(' ');
        var path = sp === -1 ? t : t.substring(0, sp);
        var rest = sp === -1 ? '' : t.substring(sp);
        if(path && !path.startsWith('blob:') && !path.startsWith('data:') && !path.startsWith('http')){
          var bb = findFileBlob(path);
          if(bb) return URL.createObjectURL(bb) + rest;
        }
        return t;
      });
      var newSs = parts.join(', ');
      if(newSs !== ss) el.setAttribute('srcset', newSs);

    var h = el.getAttribute('href');
    if(h && !h.startsWith('blob:') && !h.startsWith('data:') && !h.startsWith('http') && !h.startsWith('//')){
      var bl2 = findFileBlob(h);
      if(bl2) el.setAttribute('href', URL.createObjectURL(bl2));
    }

    var txt = el.textContent;
    if(txt && txt.indexOf('url(') !== -1){

      if(newTxt !== txt) el.textContent = newTxt;

    var ct = el.style.cssText;
    var nct = rewriteCssUrls(ct);
    if(nct !== ct) el.style.cssText = nct;

  if(el.querySelectorAll){
    el.querySelectorAll('img, source, link, style').forEach(sweepEl);

}

      attributeFilter: ['src','srcset','href','style']
    });
  } catch(e){}
}

(async function(){
  try {
    installYandexStub();
    setBootStatus('Downloading game…');

    var ZIP_URL = 'https://quizizz.com/_media/uploadedFiles/5c6e16e7-5628-47f6-8c2c-04b3f8d26d30-v2';
    var resp = await fetch(ZIP_URL);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    var total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    var reader = resp.body.getReader();
    var chunks = [], received = 0;
    while(true){
      var r = await reader.read();
      if(r.done) break;
      chunks.push(r.value);
      received += r.value.length;
      if(total > 0){
        setBootProgress((received/total)*0.4);
        setBootMB(fmtMB(received) + ' / ' + fmtMB(total));
      } else {
        setBootMB(fmtMB(received));
      }
    }
    var buf = new Uint8Array(received);
    var off = 0;
    for(var i = 0; i < chunks.length; i++){ buf.set(chunks[i], off); off += chunks[i].length; }
    chunks.length = 0;

    setBootStatus('Extracting…');
    var zip = await JSZip.loadAsync(buf.buffer);
    var names = Object.keys(zip.files);

    var prefix = '';
    var probe = names.find(function(n){ return /Build\/[^\/]+\.loader\.js$/i.test(n); });
    if(probe){
      var m = probe.match(/^(.*\/)Build\/[^\/]+\.loader\.js$/i);
      if(m) prefix = m[1];
    }

    var entries = [];
    for(var n = 0; n < names.length; n++){
      var nm = names[n];
      var ent = zip.files[nm];
      if(ent.dir) continue;
      var p = nm;
      if(prefix && p.indexOf(prefix) === 0) p = p.substring(prefix.length);
      p = p.replace(/^\/+/, '').toLowerCase();
      if(p) entries.push({ path: p, entry: ent });
    }

    var done = 0;
    for(var ei = 0; ei < entries.length; ei++){
      var it = entries[ei];
      var b = await it.entry.async('blob');
      var typed;
      if(/\.unityweb$/i.test(it.path)){
        setBootStatus('Processing ' + it.path.split('/').pop() + '…');
        var plainPath = it.path.replace(/\.unityweb$/i, '');
        var dec = await processUnityweb(b);
        typed = new Blob([dec], { type: mimeForUnityweb(plainPath) });
        fileMap.set(plainPath, typed);
        fileMap.set(it.path, typed);
      } else {
        typed = new Blob([b], { type: mimeFor(it.path) });
        fileMap.set(it.path, typed);
      }
      done++;
      setBootProgress(0.4 + (done/entries.length)*0.3);
      setBootMB(done + ' / ' + entries.length + ' files');
    }

    var loaderEntry = findBuildFile(/build\/[^\/]+\.loader\.js$/i);
    var dataEntry = findBuildFile(/build\/[^\/]+\.data(\.unityweb)?$/i);
    var frameworkEntry = findBuildFile(/build\/[^\/]+\.framework\.js(\.unityweb)?$/i);
    var wasmEntry = findBuildFile(/build\/[^\/]+\.wasm(\.unityweb)?$/i);
    var customLoaderEntry = findBuildFile(/^data\/loader\.js$/i);
    var localizationEntry = findBuildFile(/^data\/localization\.js$/i);
    var cssEntry = findBuildFile(/^data\/style\.css$/i);

    if(!loaderEntry || !dataEntry || !frameworkEntry || !wasmEntry) throw new Error('Missing build files in ZIP');
    if(!customLoaderEntry) throw new Error('Missing Data/loader.js in ZIP');

    installHooks();

    if(cssEntry){
      setBootStatus('Applying styles…');
      var cssText = await cssEntry.blob.text();
      cssText = rewriteCssUrls(cssText);
      var styleEl = document.createElement('style');
      styleEl.textContent = cssText;
      document.head.appendChild(styleEl);
    }

    var logoEl = document.getElementById('studios-logo-img');
    if(logoEl){
      var logoBlob = findFileBlob('studios_logo.webp');
      if(logoBlob) logoEl.src = URL.createObjectURL(logoBlob);
    }

    setBootStatus('Loading engine…');

    if(localizationEntry){
      await injectBlobScript(await localizationEntry.blob.text(), 'https://game.local/Data/localization.js');
    }

    var customLoaderText = await customLoaderEntry.blob.text();
    if(customLoaderText.trimStart().startsWith('<')) throw new Error('Data/loader.js is HTML, not JS');
    await injectBlobScript(customLoaderText, 'https://game.local/Data/loader.js');

    window.dispatchEvent(new Event('DOMContentLoaded'));
    window.dispatchEvent(new Event('load'));

    setTimeout(hideBoot, 1200);

  } catch(err){
    console.error(err);
    setBootStatus('Error: ' + (err && err.message ? err.message : String(err)));
  }
})();

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('touchstart', function(){ try{ window.focus(); }catch(e){} });
canvas.addEventListener('pointerdown', function(){ try{ window.focus(); }catch(e){} });
</script>
