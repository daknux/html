    });
}

function loadScript(blob, type, fakePath) {
    return new Promise((resolve) => {
        const url = URL.createObjectURL(blob.type === 'application/javascript' ? blob : new Blob([blob], { type: 'application/javascript' }));
        const s = document.createElement('script');
        if (type) s.type = type;
        if (fakePath) s.__overrideSrc = FAKE_ORIGIN + fakePath;
        scriptSrcDesc.set.call(s, url);
        s.async = false;
        s.onload = () => resolve();
        s.onerror = () => resolve();
        document.body.appendChild(s);
    });
}

try {
    setStatus('Downloading Pixilart…');
    const resp = await fetch(ZIP_URL);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total > 0) { setProgress((received / total) * 0.55); mbEl.textContent = fmtMB(received) + ' / ' + fmtMB(total); }
        else { mbEl.textContent = fmtMB(received); }
    }
    const buf = new Uint8Array(received);
    let off = 0;
    for (const c of chunks) { buf.set(c, off); off += c.length; }
    chunks.length = 0;

    setStatus('Extracting…');
    const zip = await JSZip.loadAsync(buf.buffer);
    const names = Object.keys(zip.files);
    let prefix = '';
    const probe = names.find(n => /(^|\/)js\/draw-new\/draw-new\.js$/.test(n));
    if (probe) prefix = probe.substring(0, probe.toLowerCase().lastIndexOf('js/draw-new/draw-new.js'));

    const entries = [];
    for (const name of names) {
        const entry = zip.files[name];
        if (entry.dir) continue;
        let path = name;
        if (prefix && path.startsWith(prefix)) path = path.substring(prefix.length);
        path = path.replace(/^\/+/, '').toLowerCase();
        if (path) entries.push({ path, entry });
    }

    let done = 0;
    for (const { path, entry } of entries) {
        const blob = await entry.async('blob');
        fileMap.set(path, blob.type ? blob : new Blob([blob], { type: mimeFor(path) }));
        done++;
        setProgress(0.55 + (done / entries.length) * 0.15);
    }

    setStatus('Installing hooks…');
    installInterceptors();

    setStatus('Loading styles…');
    const CSS_FILES = ['css/app.css', 'css/font-feather.css', 'js/draw-new/draw-new.css'];
    let combinedCss = '';
    for (const name of CSS_FILES) {
        const blob = fileMap.get(name);
        if (!blob) continue;
        let css = await blob.text();
        css = rewriteUrlInStyle(css);
        combinedCss += css + '\n\n';
    }
    if (combinedCss) {
        const styleEl = document.createElement('style');
        styleEl.textContent = combinedCss;
        document.head.appendChild(styleEl);
    }
    document.documentElement.style.visibility = 'visible';

    swapStaticAssets();
    killAds();

    setStatus('Loading editor…');
    const drawNewBlob = fileMap.get('js/draw-new/draw-new.js');
    if (!drawNewBlob) throw new Error('draw-new.js missing from ZIP');
    await loadScript(drawNewBlob, null, 'js/draw-new/draw-new.js');

    setStatus('Loading pixshop…');
    const pixshopBlob = fileMap.get('js/pixshop.js');
    if (pixshopBlob) await loadScript(pixshopBlob, null, 'js/pixshop.js');

    setStatus('Loading app…');
    const appBlob = fileMap.get('js/app.min.js');
    if (!appBlob) throw new Error('app.min.js missing from ZIP');
    await loadScript(appBlob, 'module', 'js/app.min.js');

    setStatus('Starting editor…');

    [0, 100, 300, 800, 1500, 3000, 6000].forEach(d => setTimeout(() => { swapStaticAssets(); killAds(); }, d));

    try {
        const obs = new MutationObserver((muts) => {
            for (const m of muts) {
                if (m.type !== 'childList') continue;
                for (const node of m.addedNodes) {
                    if (node.nodeType !== 1) continue;
                    const tag = node.tagName;
                    if (tag === 'IMG' || tag === 'SOURCE' || tag === 'VIDEO' || tag === 'AUDIO' || tag === 'LINK' || tag === 'SCRIPT') swapOneImage(node);
                    if (node.querySelectorAll) node.querySelectorAll('img, source, video, audio').forEach(swapOneImage);
                }
            }
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
    } catch (e) {}

    const mountFn = () => {
        const mount = document.getElementById('draw-new-mount');
        const PixelEditor = window.PixilartPixelEditor && (window.PixilartPixelEditor.default || window.PixilartPixelEditor);
        if (!mount || !window.Vue || !PixelEditor) {
            setTimeout(mountFn, 200);
            return;
        }
        try {
            const hostApp = window.Vue.prototype && window.Vue.prototype.app;
            window.PixilartPixelEditorInstance = new window.Vue({
                store: hostApp && hostApp.$store ? hostApp.$store : undefined,
                render: function (createElement) {
                    return createElement(PixelEditor, { props: { src: "", id: false } });
                }
            }).$mount(mount);
        } catch (e) {
            console.error('[pl] mount failed:', e);
        }
    };
    mountFn();

    const hideOnReady = () => {
        const host = document.getElementById('draw-new-mount');
        if (host && host.querySelector('canvas')) { hideLoader(); return true; }
        return false;
    };
    if (!hideOnReady()) {
        const obs = new MutationObserver(() => { if (hideOnReady()) obs.disconnect(); });
        obs.observe(document.body, { childList: true, subtree: true });
        setTimeout(() => { obs.disconnect(); hideLoader(); }, 15000);
    }

} catch (err) {
    console.error('[pl] fatal:', err);
    setStatus('Error: ' + (err && err.message ? err.message : String(err)));
}
})();
</script>
</body>
</html>
