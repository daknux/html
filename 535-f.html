async function download(url,label){
 report('Downloading '+label+'…');setProgress(0);mb.textContent='';
 const response=await fetch(url);if(!response.ok)throw Error(label+' HTTP '+response.status);
 const total=Number(response.headers.get('content-length'))||0;

 while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.byteLength;if(total)setProgress(received/total);mb.textContent=fmtMB(received)+(total?' / '+fmtMB(total):'')}

}

function urlFor(blob){if(!blobUrls.has(blob))blobUrls.set(blob,URL.createObjectURL(blob));return blobUrls.get(blob)}
function mime(p){return /\.js$/i.test(p)?'application/javascript':/\.wasm$/i.test(p)?'application/wasm':/\.css$/i.test(p)?'text/css':/\.json$/i.test(p)?'application/json':'application/octet-stream'}

  function stripLuaNoise(src) {
    return src.replace(/--\[(=*)\[[\s\S]*?\]\1\]/g, '').replace(/--[^\n]*/g, '')
              .replace(/\[(=*)\[[\s\S]*?\]\1\]/g, '')
              .replace(/"(?:\\.|[^"\\])*"/g, '""').replace(/'(?:\\.|[^'\\])*'/g, "''");
  }

  function isBalancedLuaSnippet(snippet) {
    const clean = stripLuaNoise(snippet);
    return (clean.match(/\b(?:function|if|do|repeat)\b/g) || []).length === (clean.match(/\b(?:end|until)\b/g) || []).length;
  }

  function transformGotoContinue(source) {
    let result = source.replace(/\r\n/g, '\n');
    let searchFrom = 0, iterations = 0, handled = 0;
    while (iterations++ < 500) {
      const rest = result.slice(searchFrom);
      const gotoMatch = /\bgoto\s+continue\b/.exec(rest);
      if (!gotoMatch) break;
      const gotoPos = searchFrom + gotoMatch.index;
      const gotoEnd = gotoPos + gotoMatch[0].length;
      const beforeGoto = result.slice(0, gotoPos);
      const ifRe = /\bif\b/g;
      const ifPositions = [];
      let m;
      while ((m = ifRe.exec(beforeGoto)) !== null) ifPositions.push(m.index);
      let ifPos = -1, thenPos = -1;
      for (let k = ifPositions.length - 1; k >= 0; k--) {
        const cand = ifPositions[k];
        const tIdx = result.indexOf('then', cand);
        if (tIdx < 0 || tIdx >= gotoPos) continue;
        if (!/^\s*$/.test(result.slice(tIdx + 4, gotoPos))) continue;
        ifPos = cand; thenPos = tIdx; break;
      }
      if (ifPos < 0) { searchFrom = gotoEnd; continue; }
      const afterGoto = result.slice(gotoEnd);
      const endMatch = /^\s*end\b/.exec(afterGoto);
      if (!endMatch) { searchFrom = gotoEnd; continue; }
      const ifEndPos = gotoEnd + endMatch[0].length;
      const labelIdx = result.indexOf('::continue::', ifEndPos);
      if (labelIdx < 0) { searchFrom = gotoEnd; continue; }
      const condition = result.slice(ifPos + 2, thenPos).trim();
      const body = result.slice(ifEndPos, labelIdx);
      if (/\bgoto\s+continue\b/.test(body)) { searchFrom = gotoEnd; continue; }
      if (!isBalancedLuaSnippet(body)) { searchFrom = gotoEnd; continue; }
      const baseIndent = result.slice(ifPos).match(/^[ \t]*/)[0];
      const bodyIndented = body.replace(/\s+$/, '').split('\n').map(line => line.trim() ? '    ' + line : line).join('\n');
      result = result.slice(0, ifPos) + `if not (${condition}) then\n${bodyIndented}\n${baseIndent}end` + result.slice(labelIdx + '::continue::'.length);
      handled++;
      searchFrom = 0;
    }
    return { result, handled, leftover: /\bgoto\s+continue\b/.test(result) };
  }

  function promoteNestedLongStrings(src) {
    const n = src.length;
    const out = [];
    let i = 0;
    let lastCopy = 0;
    let changed = false;
    while (i < n) {
      const c = src[i];
      if (c === '-' && i + 1 < n && src[i + 1] === '-') {
        if (i + 2 < n && src[i + 2] === '[') {
          const m = /^\[(=*)\[/.exec(src.slice(i + 2));
          if (m) {
            const level = m[1].length;
            const close = ']' + '='.repeat(level) + ']';
            const openLen = 1 + level + 1;
            let j = i + 2 + openLen;
            while (j < n && !src.startsWith(close, j)) j++;
            if (j < n) { i = j + close.length; continue; }
          }
        }
        let j = i + 2;
        while (j < n && src[j] !== '\n') j++;
        i = j;
        continue;
      }
      if (c === '"' || c === "'") {
        const quote = c;
        let j = i + 1;
        while (j < n) {
          if (src[j] === '\\') { j += 2; continue; }
          if (src[j] === quote || src[j] === '\n') { j++; break; }
          j++;
        }
        i = j;
        continue;
      }
      if (c === '[') {
        const m = /^\[(=*)\[/.exec(src.slice(i));
        if (m) {
          const level = m[1].length;
          const close = ']' + '='.repeat(level) + ']';
          const openLen = 1 + level + 1;
          let j = i + openLen;
          while (j < n && !src.startsWith(close, j)) j++;
          if (j < n) {
            const content = src.slice(i + openLen, j);
            if (content.includes('[[')) {
              let newLevel = level + 1;
              while (newLevel < 30) {
                const newClose = ']' + '='.repeat(newLevel) + ']';
                const newOpen = '[' + '='.repeat(newLevel) + '[';
                if (!content.includes(newClose) && !content.includes(newOpen)) break;
                newLevel++;
              }
              if (lastCopy < i) out.push(src.slice(lastCopy, i));
              out.push('[' + '='.repeat(newLevel) + '[' + content + ']' + '='.repeat(newLevel) + ']');
              lastCopy = j + close.length;
              changed = true;
            }
            i = j + close.length;
            continue;
          }
        }
      }
      i++;
    }
    if (!changed) return { result: src, changed: false };
    if (lastCopy < n) out.push(src.slice(lastCopy));
    return { result: out.join(''), changed: true };
  }

function patchNestedGotoContinue(src){
  const re=/(if i == 0 then\s*\n[ \t]+table\.insert\(assign_randomly, wave\)\s*\n)[ \t]+goto continue\s*\n([ \t]+)end\s*\n([\s\S]*?)\n([ \t]+)end\s*\n([ \t]+)end\s*\n([ \t]+)::continue::/g;
  return src.replace(re,(m,prefix,innerIndent,middle,midEndIndent,outerEndIndent)=>
    prefix+innerIndent+'else\n'+middle+'\n'+midEndIndent+'end\n'+innerIndent+'end\n'+outerEndIndent+'end');
}

function patchTrailingGuardContinue(src){
 const re=/^([ \t]*)if[ \t]+([^\n]+?)[ \t]+then[^\n]*\n[ \t]*goto[ \t]+continue[ \t]*(?:--[^\n]*)?\n[ \t]*end[ \t]*(?:--[^\n]*)?\n([\s\S]*?)^([ \t]*)::continue::[^\n]*\n(?=[ \t]*end\b)/gm;
 return src.replace(re,(whole,indent,condition,body,labelIndent)=>{
   if(indent!==labelIndent || /\bgoto\s+continue\b|::continue::/.test(body))return whole;
   if(!isBalancedLuaSnippet(body))return whole;
   return indent+'if not ('+condition.trim()+') then\n'+body+indent+'end\n';
 });
}

async function patchLuaSources(archive){
 const paths=Object.keys(archive.files).filter(p=>/\.lua$/i.test(p)&&!archive.files[p].dir);
 let changed=0, unresolved=[];
 for(let i=0;i<paths.length;i++){
  const path=paths[i], entry=archive.file(path);
  let source=await entry.async('string');
  if(!/\bgoto\s+continue\b|\[\[/.test(source))continue;
  let result=source;
  if(/\bgoto\s+continue\b/.test(result)){
   const transformed=transformGotoContinue(result);
   result=transformed.result;
   if(transformed.leftover){
     result=patchNestedGotoContinue(result);
     if(/\bgoto\s+continue\b/.test(result))result=patchTrailingGuardContinue(result);
     if(/\bgoto\s+continue\b/.test(result))unresolved.push(path);
   }
  }
  if(result.includes('[['))result=promoteNestedLongStrings(result).result;
  if(result!==source){archive.file(path,result);changed++}
  if(i%40===0)report('Scanning Lua compatibility… '+(i+1)+'/'+paths.length);
 }
 console.log('[Kristal Player] Lua compatibility files patched:',changed,'unresolved goto files:',unresolved);
 if(unresolved.length){console.warn('[Kristal Player] Some Lua goto constructs could not be safely rewritten:',unresolved);report('Warning: unsupported Lua goto syntax in '+unresolved.length+' file(s)');}
 return {changed,unresolved};
}

async function setGameFavicon(zip){
  const files=Object.values(zip.files).filter(e=>!e.dir);
  const ranked=[];
  for(const entry of files){
    const name=entry.name.replace(/\\/g,'/').toLowerCase();
    if(!/\.(ico|png|webp|jpg|jpeg)$/.test(name))continue;
    const base=name.split('/').pop();
    let score=-1;
    if(base==='icon.ico')score=100;
    else if(base==='icon.png')score=95;
    else if(base==='favicon.ico')score=94;
    else if(base==='favicon.png')score=93;
    else if(base==='game.ico'||base==='game.png')score=90;
    else if(base==='logo.png' && name.split('/').length<=3)score=40;
    if(score<0)continue;
    if(/^assets\/(?:images\/)?/.test(name))score+=2;
    if(name.startsWith('mods/'))score-=35;
    ranked.push({entry,score});
  }
  ranked.sort((a,b)=>b.score-a.score || a.entry.name.length-b.entry.name.length);

    try{
      const ext=entry.name.split('.').pop().toLowerCase();
      const type=ext==='ico'?'image/x-icon':ext==='png'?'image/png':ext==='webp'?'image/webp':'image/jpeg';

      if(bytes.byteLength>8*1024*1024)continue;

}
