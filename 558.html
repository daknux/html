<!DOCTYPE html>
<html lang="en">
	<head>
		<base href="https://cdn.jsdelivr.net/gh/TheBlehLollipop/Uncanny-Cat-Golf-webport@v2/">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Uncanny Cat Golf</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
#status-parts {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 15%;
	text-align: center;
	z-index: 1;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1rem;
	line-height: 1.6;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="UncannyCatGolf.icon.png" />
<link rel="apple-touch-icon" href="UncannyCatGolf.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="UncannyCatGolf.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-parts"></div>
			<div id="status-notice"></div>
		</div>

		<script>
const PARTS = {
	"UncannyCatGolf.pck":  { count: 35, type: "application/octet-stream" },
	"UncannyCatGolf.wasm": { count: 3,   type: "application/wasm" },
};
const partName = (name, i) => `${name}.${String(i + 1).padStart(3, "0")}`;

const LABELS = { "UncannyCatGolf.pck": "Game data", "UncannyCatGolf.wasm": "Engine" };
const progressState = {};
function showProgress(name, done, count) {
	progressState[name] = { done, count };
	const el = document.getElementById("status-parts");
	if (el) {
		el.innerHTML = Object.keys(progressState).map((n) => {
			const p = progressState[n];
			return `${LABELS[n] || n}: ${p.done} / ${p.count} parts` + (p.done === p.count ? " \u2713" : "");
		}).join("<br>");
	}
	const bar = document.getElementById("status-progress");
	if (bar && name === "UncannyCatGolf.pck") {
		bar.max = count;
		bar.value = done;
	}
}

const MIRRORS = ["gcore.jsdelivr.net", "fastly.jsdelivr.net", "cdn.jsdelivr.net"];
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
	const url = typeof input === "string" ? input : input.url;
	const path = new URL(url, document.baseURI).pathname;
	const name = Object.keys(PARTS).find((n) => path.endsWith("/" + n));
	if (!name) {
		return realFetch(input, init);
	}
	const { count, type } = PARTS[name];
	const dir = new URL(".", document.baseURI).href;
	const chunks = new Array(count);
	let next = 0;
	let done = 0;
	showProgress(name, 0, count);

	async function getPart(i) {
		const MAX = 6;
		for (let attempt = 0; attempt < MAX; attempt++) {
			const host = MIRRORS[(i + attempt) % MIRRORS.length];
			const u = new URL(dir);
			if (u.hostname.endsWith("jsdelivr.net")) u.hostname = host;
			try {
				const r = await realFetch(u.href + partName(name, i));
				if (!r.ok) throw new Error("HTTP " + r.status);
				return await r.arrayBuffer();
			} catch (e) {
				if (attempt === MAX - 1) throw new Error("Failed to load " + partName(name, i) + ": " + e.message);
				await new Promise((res) => setTimeout(res, 700 * (attempt + 1)));
			}
		}
	}
	async function worker() {
		while (next < count) {
			const i = next++;
			chunks[i] = await getPart(i);
			done++;
			showProgress(name, done, count);
		}
	}
	await Promise.all(Array.from({ length: 4 }, worker));

	const blob = new Blob(chunks, { type });
	return new Response(blob, {
		status: 200,
		headers: { "Content-Type": type, "Content-Length": String(blob.size) },
	});
};
		</script>
		<script src="UncannyCatGolf.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"UncannyCatGolf","experimentalVK":false,"fileSizes":{"UncannyCatGolf.pck":543491680,"UncannyCatGolf.wasm":36145869},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
