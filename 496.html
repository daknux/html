<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="https://cdn.jsdelivr.net/gh/bobydob/JSEngine@4c04e7fb85008b3d23ba8848826ba2c0a859fa4f/build/bts-sans/">

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }

    #c2canvasdiv {
      width: 640px;
      height: 480px;
      margin-left: 342px;
      margin-top: 202px;
    }

    #c2canvas {
      display: block;
      width: 640px;
      height: 480px;
      touch-action: none;
    }
  </style>

  <script>
    const cancelFrame = window.cancelAnimationFrame.bind(window);

    window.cancelAnimationFrame = function (value) {
      return typeof value === "function"
        ? window.requestAnimationFrame(value)
        : cancelFrame(value);
    };
  </script>

  <script src="offlineClient.js"></script>
</head>
<body>
  <div id="c2canvasdiv">
    <canvas id="c2canvas" width="640" height="480"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/nbjrkzddz/5yrgdegfwfew4@d3772e576f5a2ad716d32ace9c7e5b94f59ded9e/bigfoot/g/gfiles/gfiles/html5/sans-fight/jquery-3.4.1.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/bobydob/JSEngine@4c04e7fb85008b3d23ba8848826ba2c0a859fa4f/build/bts-sans/c2.js"></script>

  <script>
    jQuery(function () {
      cr_createRuntime("c2canvas");
    });

    document.addEventListener("visibilitychange", function () {
      cr_setSuspended(document.hidden);
    });

    window.C2_RegisterSW = function () {
      if (!navigator.serviceWorker) return;

      navigator.serviceWorker.register("sw.js", { scope: "./" })
        .catch(function (error) {
          console.warn("Service worker registration failed:", error);
        });
    };
  </script>
</body>
</html>
