<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Baldi's Basics Squared Demo</title>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
    }

    #unity-canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background: #000;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 100;
      display: none;
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url("https://media.blooket.com/raw/upload/zsvtifp11njzlloxqyuj.png")
        center / contain no-repeat;
    }

    #unity-progress-bar-empty {
      position: relative;
      width: 141px;
      height: 18px;
      margin-top: 10px;
      margin-left: 6.5px;
      overflow: hidden;
      background: url("https://media.blooket.com/raw/upload/rgbq0ncrr4sttnrhz2gv.png")
        center / 141px 18px no-repeat;
    }

    #unity-progress-bar-full {
      width: 141px;
      height: 18px;
      background: url("https://media.blooket.com/raw/upload/bhkcuzv1fiagwk8sfxve.png")
        left center / 141px 18px no-repeat;
      transform: scaleX(0);
      transform-origin: left center;
    }

    #unity-warning {
      position: absolute;
      top: 5%;
      left: 50%;
      z-index: 200;
      display: none;
      padding: 10px;
      transform: translateX(-50%);
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.innerHTML = message;

      if (type === "error") {
        div.style.cssText = "background:red;padding:10px;";
      } else if (type === "warning") {
        div.style.cssText = "background:yellow;padding:10px;";
      }

      warningBanner.appendChild(div);
      warningBanner.style.display = "block";

      if (type !== "error") {
        setTimeout(() => {
          div.remove();

          if (!warningBanner.children.length) {
            warningBanner.style.display = "none";
          }
        }, 5000);
      }
    }

    const config = {
      dataUrl:
        "https://quizizz.com/_media/baldi/1fc8ad1a-50d8-4bfa-860c-9cf2d49bfca3-v2",
      frameworkUrl:
        "https://media.blooket.com/raw/upload/fffoml8v2llxft67dlur.br",
      codeUrl:
        "https://media.blooket.com/raw/upload/hnh8w8uubcv6ccecopqm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Naberson265 Games",
      productName: "Baldi's Basics Squared Demo",
      productVersion: "FD1.0d",
      showBanner: unityShowBanner
    };

    canvas.style.background =
      "url('https://media.blooket.com/raw/upload/kf35l2g43xxsx9scfqya.jpg') center / cover";

    loadingBar.style.display = "block";

    async function loadJsSvg(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          "Failed to load JavaScript: HTTP " + response.status
        );
      }

      const source = await response.text();
      const matches = [...source.matchAll(/<svg\b[^>]*>/gi)];

      if (!matches.length) {
        return source;
      }

      const start =
        matches.length >= 2
          ? matches[1].index + matches[1][0].length
          : matches[0].index + matches[0][0].length;

      return source.substring(start);
    }

    loadJsSvg(
      "https://media.blooket.com/raw/upload/zqmqq4i88lq1z7jawcra.js-svg"
    )
      .then(code => {
        const script = document.createElement("script");
        script.textContent = code;
        document.body.appendChild(script);

        createUnityInstance(canvas, config, progress => {
          progressBar.style.transform = `scaleX(${progress})`;
        })
          .then(() => {
            loadingBar.style.display = "none";
          })
          .catch(error => {
            alert(error);
          });
      })
      .catch(error => {
        console.error("JS-SVG loader error:", error);
        alert(error);
      });
  </script>
</body>
</html>
