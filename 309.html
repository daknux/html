<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Baldi Commits Homocide</title>

  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: absolute;
    }

    #unity-container.unity-desktop {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #unity-container.unity-mobile {
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #unity-canvas,
    .unity-mobile #unity-canvas {
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      display: none;
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url("https://media.blooket.com/raw/upload/zztqjdzdt58hj0ozgkdd.png")
        no-repeat center;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      margin-left: 6.5px;
      background: url("https://media.blooket.com/raw/upload/mzuz4t0no7ckroyxxecw.png")
        no-repeat center;
    }

    #unity-progress-bar-full {
      width: 0;
      height: 18px;
      margin-top: 10px;
      background: url("https://media.blooket.com/raw/upload/nfkzobt0iffak2sfxwvi.png")
        no-repeat center;
    }

    #unity-warning {
      position: absolute;
      top: 5%;
      left: 50%;
      display: none;
      padding: 10px;
      transform: translateX(-50%);
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBar = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(message, type) {
      warningBanner.style.display = "block";

      const div = document.createElement("div");
      div.innerHTML = message;

      if (type === "error") {
        div.style.cssText = "background:red;color:white;padding:10px;";
      }

      warningBanner.appendChild(div);
    }

    async function getGzip(url, type, start, end) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(response.status);
      }

      const reader = response.body.getReader();
      const total = Number(response.headers.get("Content-Length"));
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();

        if (done) {
          break;
        }

        chunks.push(value);
        received += value.length;

        if (total) {
          const progress = received / total;

          progressBar.style.width =
            `${(start + progress * (end - start)) * 100}%`;
        }
      }

      const buffer = new Uint8Array(received);
      let offset = 0;

      for (const chunk of chunks) {
        buffer.set(chunk, offset);
        offset += chunk.length;
      }

      const decompressed = pako.inflate(buffer);

      const mime = {
        js: "application/javascript",
        wasm: "application/wasm"
      }[type] || "application/octet-stream";

      return URL.createObjectURL(
        new Blob([decompressed], { type: mime })
      );
    }

    async function loadJsSvg(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(response.status);
      }

      const source = await response.text();
      const matches = [...source.matchAll(/<svg\b[^>]*>/gi)];

      if (!matches.length) {
        return source;
      }

      const start =
        matches.length >= 2
          ? matches[1].index + matches[1][0].length
          : matches[0].index + matches[0][0].length;

      return source.substring(start);
    }

    (async () => {
      loadingBar.style.display = "block";

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

        document.head.appendChild(meta);

        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        container.className = "unity-desktop";
      }

      const frameworkURL = await getGzip(
        "https://media.blooket.com/raw/upload/kautap7hlaxax9cba79x.gz",
        "js",
        0,
        0.25
      );

      const dataURL = await getGzip(
        "https://media.blooket.com/raw/upload/h9dzawfec0whnkpbync1.gz",
        "data",
        0.25,
        0.55
      );

      const wasmURL = await getGzip(
        "https://media.blooket.com/raw/upload/am0rx4aignlscf6ehux7.gz",
        "wasm",
        0.55,
        0.95
      );

      progressBar.style.width = "95%";

      const config = {
        dataUrl: dataURL,
        frameworkUrl: frameworkURL,
        codeUrl: wasmURL,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Goldn Stuff",
        productName: "Baldi Commits Homocide",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      try {
        const source = await loadJsSvg(
          "https://media.blooket.com/raw/upload/cw5nudm9tp5zfdqqvyce.js-svg"
        );

        const loader = document.createElement("script");
        loader.textContent = source;
        document.body.appendChild(loader);

        createUnityInstance(
          canvas,
          config,
          progress => {
            progressBar.style.width = `${95 + progress * 5}%`;
          }
        )
          .then(() => {
            loadingBar.style.display = "none";
          })
          .catch(error => {
            console.error(error);
            unityShowBanner(error, "error");
          });
      } catch (error) {
        console.error(error);
        unityShowBanner(error, "error");
      }
    })();
  </script>
</body>
</html>
